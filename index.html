function updatePlayer(p,dt){
  if(!p.alive)return;
  if(p.controller.pre)p.controller.pre(p,dt);
  let{x:mx,y:my}=p.controller.move(p);
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  let spd=p.spd;
  p.dashCd=Math.max(0,p.dashCd-dt);const _prevDashT=p.dashT;p.dashT=Math.max(0,p.dashT-dt);
  p._dashJustEnded=_prevDashT>0&&p.dashT===0;
  const db=p.controller.dash(p);
  if(db&&!p.edge.dash&&p.dashCd<=0&&(mx||my)){p.dashT=.18;p.dashCd=overdriveActive?.18:1.2;p.iframe=Math.max(p.iframe,.18);smoke(p.x,p.y);}
  p.edge.dash=db;
  if(p.dashT>0)spd*=3.2;
  // Charge button (need early peek to apply speed penalty)
  const chB=p.controller.charge(p);
  if(chB&&p.dashT<=0)spd*=0.35;
  p.vx=mx*spd;p.vy=my*spd;
  // CPU wall avoidance: try perpendicular when heading into a wall
  if((!p.isHuman||monkeyMode)&&(mx||my)&&hitsWall(p.x+p.vx*.08,p.y+p.vy*.08,p.r)){
    const a=Math.atan2(p.vy,p.vx);
    const a2=a+Math.PI/2,a3=a-Math.PI/2;
    if(!hitsWall(p.x+Math.cos(a2)*spd*.08,p.y+Math.sin(a2)*spd*.08,p.r)){p.vx=Math.cos(a2)*spd*.7;p.vy=Math.sin(a2)*spd*.7;}
    else if(!hitsWall(p.x+Math.cos(a3)*spd*.08,p.y+Math.sin(a3)*spd*.08,p.r)){p.vx=Math.cos(a3)*spd*.7;p.vy=Math.sin(a3)*spd*.7;}
  }
  moveObj(p,dt);
  p.aim=p.controller.aim(p);
  // Charge accumulation / release
  if(chB&&p.dashT<=0){p.chargeT+=dt;}
  else if(p.chargeT>0&&!chB){fireChargeShot(p,p.chargeT);p.chargeT=0;}
  p.fireCd=Math.max(0,p.fireCd-dt);
  // Normal fire: auto (hold), disabled while charging
  const fb=p.controller.fire(p);
  p.edge.fire=fb;
  if(!chB&&fb&&p.fireCd<=0){
    const w=p.weapon;
    const spread=p.level>=3?w.spread*.6:w.spread;
    const ox=Math.cos(p.aim)*5,oy=Math.sin(p.aim)*5;
    const dmg=(w.dmg+p.level*.4)*.25;
    const angles=driverActive?[p.aim-0.22,p.aim,p.aim+0.22]:[p.aim+rnd(-spread,spread)];
    const lSpd=laserActive?1.5:1,lRange=laserActive?1.6:1;
    for(const a of angles)bullets.push({x:p.x+ox,y:p.y+oy,vx:Math.cos(a)*w.spd*lSpd,vy:Math.sin(a)*w.spd*lSpd,life:w.range*lRange,dmg:dmg*(driverActive?.7:1)*(laserActive?.8:1),owner:p,trail:[],pierce:laserActive?3:0});
    if(vertidriveActive)bullets.push({x:p.x-ox,y:p.y-oy,vx:Math.cos(p.aim+Math.PI)*w.spd*lSpd,vy:Math.sin(p.aim+Math.PI)*w.spd*lSpd,life:w.range*lRange,dmg:dmg*.8*(laserActive?.8:1),owner:p,trail:[],pierce:laserActive?3:0});
    p.fireCd=w.fireCd*(driverActive?1.15:1);p.muzzle=.08;
    shake=Math.max(shake,.8);
    p.vx-=Math.cos(p.aim)*7;p.vy-=Math.sin(p.aim)*7;
  }
  p.iframe=Math.max(0,p.iframe-dt);
  p.muzzle=Math.max(0,p.muzzle-dt);
  if(p._dcpFlash>0)p._dcpFlash=Math.max(0,p._dcpFlash-dt);
  // Parry
  p.parryCd=Math.max(0,p.parryCd-dt);
  p.parryT=Math.max(0,p.parryT-dt);
  if(p.isHuman&&p.controller.parry){
    const parB=p.controller.parry(p);
    if(parB&&!p.edge.parry&&p.parryCd<=0){
      p.parryT=.18;p.parryCd=1.5;
      spark(p.x,p.y,'#fff',5,35);
      // Dash-cancel parry: 1-frame window after dash ends → massive damage
      if(p._dashJustEnded){
        for(const e of enemies){
          if(Math.hypot(e.x-p.x,e.y-p.y)<35){
            const fa=Math.atan2(e.y-p.y,e.x-p.x);
            e.hp-=200;e.hit=.15;
            if(e.type!=='boss'){
              e._flungVx=Math.cos(fa)*240;e._flungVy=Math.sin(fa)*240;e._flung=0.8;
            }
            spark(e.x,e.y,'#ff0',14,110);
          }
        }
        p._dcpFlash=0.12;
        shake=Math.max(shake,3);
        flash('DASH PARRY!','#ff0');
        SE.dashParry();
        _hasDashParried=true;
      }
    }
    p.edge.parry=parB;
  }
  // CPU auto-parry: activate when a ghost enters close range
  if(!p.isHuman&&p.parryCd<=0){
    const ghostClose=enemies.some(e=>e.type==='ghost'&&Math.hypot(e.x-p.x,e.y-p.y)<25);
    if(ghostClose){p.parryT=.18;p.parryCd=2.0;spark(p.x,p.y,'#adf',5,30);}
  }
  p.shieldAngle=(p.shieldAngle+dt*1.8)%(Math.PI*2);
}

function fireChargeShot(p,t){
  const MAX_CHARGE=1.5;
  const power=Math.min(1,t/MAX_CHARGE);
  const w=p.weapon;
  const r=1.5+power*12.5;        // bullet radius 1.5→14
  const dmg=(w.dmg+p.level*.4)*(1+power*10);  // 1x to 11x
  const spd=w.spd*(.65+power*.2);
  const range=w.range*(1.5+power*.8);
  const ox=Math.cos(p.aim)*5,oy=Math.sin(p.aim)*5;
  bullets.push({x:p.x+ox,y:p.y+oy,
    vx:Math.cos(p.aim)*spd,vy:Math.sin(p.aim)*spd,
    life:range,dmg,owner:p,trail:[],r,charge:true,power});
  p.muzzle=.2+power*.25;
  shake=Math.max(shake,2+power*5);
  spark(p.x+Math.cos(p.aim)*10,p.y+Math.sin(p.aim)*10,'#ff0',Math.round(6+power*12),110+power*130);
  spark(p.x+Math.cos(p.aim)*10,p.y+Math.sin(p.aim)*10,p.pal.trail,Math.round(4+power*6),80+power*80);
}

function update(dt){
  time+=dt;
  if(!running)return;
  callCooldown=Math.max(0,callCooldown-dt);
  callAggroTimer=Math.max(0,callAggroTimer-dt);
  // ── Gamepad Select → callCPU ──
  {const gps=navigator.getGamepads?navigator.getGamepads():[];for(const gp of gps){if(!gp)continue;const sel=!!gp.buttons[8]?.pressed;if(sel&&!_prevSel)callCPU();_prevSel=sel;break;}}

  // ── Bullet time ──
  let eff=dt;
  if(bulletTime){
    eff=dt*.07;
    bulletTime.timer-=dt;
    // Invincibility for all alive
    for(const p of players)if(p.alive)p.iframe=Math.max(p.iframe,.15);
    if(bulletTime.timer<=0){
      bulletTime=null;
    }
  }

  // ── Players ──
  for(const p of players){updatePlayer(p,eff);if(p.alive)revealFog(p.x,p.y);}
  // Update flow field when human player moves to a new tile
  {const _hpf=humanPlayer();if(_hpf)buildFlowField(_hpf.x,_hpf.y);}
  // soft player-player separation
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){
    const a=players[i],b=players[j];if(!a.alive||!b.alive)continue;
    const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy),mn=a.r+b.r;
    if(d>0&&d<mn){const push=(mn-d)*.5;const nax=a.x+dx/d*push,nay=a.y+dy/d*push,nbx=b.x-dx/d*push,nby=b.y-dy/d*push;if(!hitsWall(nax,nay,a.r)){a.x=nax;a.y=nay;}if(!hitsWall(nbx,nby,b.r)){b.x=nbx;b.y=nby;}}
  }

  // ── Enemy spawn ──
  spawnT-=eff;
  const maxE=Math.min(40,Math.floor(8+stage*.32));
  const spawnInterval=Math.max(.3,1.4-stage*.011);
  if(!monsterHouse&&spawnT<=0&&enemies.length<maxE){
    spawnT=spawnInterval;
    spawnEnemy(_pickType(stage,Math.random()));
  }
  // ── Monster House clear check ──
  if(monsterHouse&&!monsterHouseCleared&&mhSpawnPending===0&&time>2&&enemies.length===0){
    monsterHouseCleared=true;exitOpen=true;
    const cx=(MAPW>>1)*TILE+8,cy=(MAPH>>1)*TILE+8;
    // Offset reward if it would land on the exit
    let rpx=cx,rpy=cy;
    if(exits[0]&&Math.hypot(exits[0].x-cx,exits[0].y-cy)<TILE*2)rpy=cy-TILE*2.5;
    if(Math.random()<0.03){pickups.push({type:'revive',x:rpx,y:rpy,t:0});SE.revive();flash('!! CLEARED !!','#ff0');flash('★ REVIVE ITEM DROPPED ★','#fa0');}
    else{flash('!! CLEARED !!','#ff0');}
    shake=Math.max(shake,5);
    spark(cx,cy,'#ff0',24,160);spark(cx,cy,'#fff',12,100);
  }

  // ── Player bullets ──
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>5)b.trail.shift();
    b.x+=b.vx*eff;b.y+=b.vy*eff;b.life-=eff;
    if(b.life<=0||solid(b.x,b.y)){
      // Secret wall hit?
      const bTx=(b.x/TILE)|0,bTy=(b.y/TILE)|0;
      if(secretWallPos&&bTx===secretWallPos.tx&&bTy===secretWallPos.ty){
        secretWallHits++;
        SE.clang();
        spark(b.x,b.y,'#ffd700',6,70);
        if(secretWallHits>=25){
          // Destroy secret wall, drop driver or overdrive (50/50)
          map[secretWallPos.ty*MAPW+secretWallPos.tx]=0;
          // Prioritise items not yet obtained
          const pool=[];
          if(!driverActive)pool.push('driver');
          if(!overdriveActive)pool.push('overdrive');
          if(!vertidriveActive)pool.push('vertidrive');
          if(!laserActive)pool.push('laser');
          {const _hp=humanPlayer();if(!_hp||_hp.shields.length<4)pool.push('barrier');}
          const _fbHp=humanPlayer();const _fbPool=['driver','overdrive','vertidrive','laser'];if(!_fbHp||_fbHp.shields.length<4)_fbPool.push('barrier');
          const pick=pool.length?pool[rndi(0,pool.length)]:_fbPool[rndi(0,_fbPool.length)];
          if(pick==='driver'){driverActive=true;flash('DRIVER FOUND!','#ffd700');flash('3-WAY SHOT ACTIVE!','#ffd700');}
          else if(pick==='overdrive'){overdriveActive=true;flash('OVERDRIVE FOUND!','#f80');flash('DASH RECHARGE UP!','#f80');}
          else if(pick==='laser'){laserActive=true;flash('LASER FOUND!','#0ff');flash('PIERCE SHOTS ACTIVE!','#0ff');}
          else if(pick==='barrier'){const _hp=humanPlayer();if(_hp){_hp.shields.push({hp:3,maxHp:3});flash('BARRIER FOUND!','#4ff');flash('SHIELD ORB x'+_hp.shields.length,'#4ff');}}
          else{vertidriveActive=true;flash('VERTIDRIVE FOUND!','#f0f');flash('BACK SHOT ACTIVE!','#f0f');}
          spark(bTx*TILE+8,bTy*TILE+8,'#ffd700',24,140);
          SE.driver();secretWallPos=null;
        }else{
          spark(b.x,b.y,'#ff8',2,50);
        }
      }else{spark(b.x,b.y,'#ff8',4,80);}
      bullets.splice(i,1);continue;
    }
    let hit=false;
    // gatekeeper absorbs bullets (parry bullets deal hits)
    for(let gi=gatekeepers.length-1;gi>=0;gi--){
      const gk=gatekeepers[gi];
      if((b.x-gk.x)**2+(b.y-gk.y)**2<6*6){
        if(b.parried){
          gk.parryHits++;
          spark(b.x,b.y,'#fff',6,60);
          gk.hit=0.1;
          if(gk.parryHits>=5){
            spark(gk.x,gk.y,'#f44',16,90);smoke(gk.x,gk.y);
            shake=Math.max(shake,4);
            gatekeepers.splice(gi,1);
          }
        }else{spark(b.x,b.y,'#f44',3,40);}
        bullets.splice(i,1);hit=true;break;
      }
    }
    if(hit)continue;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];const dx=e.x-b.x,dy=e.y-b.y;
      if(e.type==='ghost')continue; // immune to all bullets
      if(dx*dx+dy*dy<(e.r+(b.r||1.5))**2){
        e.hp-=b.dmg;e.hit=.1;e.vx+=b.vx*.05;e.vy+=b.vy*.05;
        blood(b.x,b.y);
        if(e.hp<=0){
          e._dead=true;enemies.splice(j,1);
          totalKills++;if(b.owner)b.owner.kills++;
          // splatter: split into 2 mini grunts
          if(e.type==='splatter'&&!e._split){
            for(let k=0;k<2;k++){const a=Math.random()*Math.PI*2;const mini=makeEnemy('grunt',e.x+Math.cos(a)*8,e.y+Math.sin(a)*8);mini.hp=Math.max(1,mini.hp*.4);mini.r=2;mini._split=true;enemies.push(mini);}
          }
          if(e.type==='boss'&&!e._isFake)SE.bossDeath();else SE.kill();
          spark(e.x,e.y,'#c22',12,90);smoke(e.x,e.y);shake=Math.max(shake,2);
          // drops
          const healRate=stage>50?Math.max(.02,.12-(stage-50)*.002):.12;
          if(chance(.08))pickups.push({type:'core',x:e.x,y:e.y,t:0});
          if(chance(healRate))pickups.push({type:'health',x:e.x,y:e.y,t:0});
          // boss drops
          if(e.type==='boss'){
            if(e._isFake){
              // Decoy — no rewards, no game effects
              flash('★ A DECOY! ★','#fa8');shake=Math.max(shake,4);
              spark(e.x,e.y,'#aaa',24,80);
            }else{
              for(let k=0;k<3;k++)pickups.push({type:'health',x:e.x+rnd(-16,16),y:e.y+rnd(-16,16),t:0});
              flash('★ BOSS SLAIN ★','#ff0');shake=Math.max(shake,5);
              if(driverActive){flash('DRIVER STILL ACTIVE!','#ffd700');}
              if(laserActive){laserActive=false;flash('LASER EXPIRED','#888');}
              if(overdriveActive){flash('OVERDRIVE STILL ACTIVE!','#f80');}
              if(vertidriveActive){flash('VERTIDRIVE STILL ACTIVE!','#f0f');}
              if(!attractDemo)PSG.play(stage); // revert to zone BGM
              // restore any devoured cores (partial refund)
              const refund=Math.min(coresNeeded-coresCollected,2);
              if(refund>0){coresCollected+=refund;flash('CORE RECOVERED +'+refund,'#0ff');}
              // open exit if cores already done
              if(coresCollected>=coresNeeded&&!exitOpen){exitOpen=true;flash('EXIT OPEN','#ff0');}
            }
          }
          // zombie drops bonus
          if(e.type==='zombie'){
            const xpDrop=e.dropXp||0;
            if(xpDrop>0&&b.owner){b.owner.xp+=xpDrop;flash('VENGEANCE +'+xpDrop+'XP','#ff0');}
            if(e.dropCores>0){coresCollected+=e.dropCores;flash('RECLAIMED +'+e.dropCores+' CORE','#0ff');}
          }
          if(b.owner){
            const xpg=e.type==='boss'?50:e.type==='brute'?6:e.type==='zombie'?8:e.type==='shooter'?3:2;
            b.owner.xp+=xpg;b.owner.accXp+=xpg;
            while(b.owner.xp>=b.owner.level*10){
              b.owner.xp-=b.owner.level*10;b.owner.level++;
              b.owner.maxHp+=10;b.owner.hp=Math.min(b.owner.maxHp,b.owner.hp+20);
              b.owner.weapon.dmg+=.5;
              flash(b.owner.pal.name+' LV.'+b.owner.level,b.owner.pal.body);
            }
          }
        }
        if(b.pierce>0){b.pierce--;spark(b.x,b.y,'#0cf',2,35);}
        else{hit=true;bullets.splice(i,1);break;}
      }
    }
  }

  // ── Enemy bullets ──
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];b.x+=b.vx*eff;b.y+=b.vy*eff;b.life-=eff;
    if(b.life<=0||(solid(b.x,b.y)&&!b.wallpass)){spark(b.x,b.y,'#f8a',4,60);ebullets.splice(i,1);continue;}
    // Parry check (before damage)
    let parried=false;
    for(const p of players){
      if(!p.alive||p.parryT<=0)continue;
      if(Math.hypot(b.x-p.x,b.y-p.y)<18){
        // reflect bullet back as player bullet
        bullets.push({x:b.x,y:b.y,vx:-b.vx*1.1,vy:-b.vy*1.1,life:1.2,dmg:b.dmg*1.5,owner:p,trail:[],parried:true});
        ebullets.splice(i,1);
        spark(b.x,b.y,'#fff',10,70);SE.clang();
        flash('PARRY!','#fff');
        parried=true;break;
      }
    }
    if(parried)continue;
    // Shield orb: block bullet before player takes damage
    let shieldHit=false;
    for(const p of players){
      if(!p.alive||!p.shields.length)continue;
      const n=p.shields.length;
      for(let si=n-1;si>=0;si--){
        const sang=p.shieldAngle+si*(Math.PI*2/n);
        const sx=p.x+Math.cos(sang)*10,sy=p.y+Math.sin(sang)*10;
        if((b.x-sx)**2+(b.y-sy)**2<16){
          p.shields[si].hp--;spark(sx,sy,'#0ff',4,50);SE.clang();
          if(p.shields[si].hp<=0){p.shields.splice(si,1);flash('SHIELD BROKEN!','#f88');spark(sx,sy,'#0ff',10,80);shake=Math.max(shake,2);}
          ebullets.splice(i,1);shieldHit=true;break;
        }
      }
      if(shieldHit)break;
    }
    if(shieldHit)continue;
    for(const p of players){
      if(!p.alive)continue;
      const dx=p.x-b.x,dy=p.y-b.y;
      if(dx*dx+dy*dy<(p.r+(b.r||1.5))**2){ebullets.splice(i,1);damagePlayer(p,b.dmg);break;}
    }
  }

  // ── Enemy AI ──
  const _callHp=callAggroTimer>0?humanPlayer():null;
  for(const e of enemies){
    let tgt=null,td=Infinity;
    if(_callHp&&fog[(e.y/TILE|0)*MAPW+(e.x/TILE|0)]>0){tgt=_callHp;}
    else for(const p of players){if(!p.alive)continue;const d=(p.x-e.x)**2+(p.y-e.y)**2;if(d<td){td=d;tgt=p;}}
    if(!tgt){e.vx*=.9;e.vy*=.9;moveObj(e,eff);continue;}
    const dx=tgt.x-e.x,dy=tgt.y-e.y,d=Math.hypot(dx,dy)||1;
    e.ang=Math.atan2(dy,dx);e.atkCd=Math.max(0,e.atkCd-eff);e.hit=Math.max(0,e.hit-eff);e.anim+=eff;
    if(e.type==='poison'){
      e.vx=Math.cos(e.ang)*e.spd;e.vy=Math.sin(e.ang)*e.spd;
      if(d<e.r+tgt.r+1&&e.atkCd<=0){damagePlayer(tgt,e.dmg);e.atkCd=.9;}
      e.pudCd-=eff;
      if(e.pudCd<=0){poisonPuddles.push({x:e.x,y:e.y,t:6,damageCd:0});e.pudCd=0.7;}
    } else if(e.type==='dasher'){
      e.dashCd-=eff;e.dashT=Math.max(0,e.dashT-eff);
      if(e.dashing){
        if(e.dashT<=0||hitsWall(e.x+e.dashVx*eff,e.y+e.dashVy*eff,e.r)){e.dashing=false;e.dashCd=rnd(1.8,2.8);}
        else{e.x+=e.dashVx*eff;e.y+=e.dashVy*eff;}
        if(d<e.r+tgt.r+1&&e.atkCd<=0){damagePlayer(tgt,e.dmg);e.atkCd=.4;}
      }else{
        e.vx=Math.cos(e.ang)*e.spd*.35;e.vy=Math.sin(e.ang)*e.spd*.35;
        if(e.dashCd<=0&&d<150){e.dashing=true;e.dashT=.32;e.dashVx=Math.cos(e.ang)*e.spd*4;e.dashVy=Math.sin(e.ang)*e.spd*4;e.dashCd=rnd(1.8,2.8);spark(e.x,e.y,'#f80',4,50);}
        if(d<e.r+tgt.r+1&&e.atkCd<=0){damagePlayer(tgt,e.dmg*.4);e.atkCd=.5;}
      }
    } else if(e.type==='ghost'){
      e.vx=Math.cos(e.ang)*e.spd;e.vy=Math.sin(e.ang)*e.spd;
      // pass through walls — movement handled after AI block
      if(d<e.r+tgt.r+1&&e.atkCd<=0){damagePlayer(tgt,e.dmg);e.atkCd=.9;}
    } else if(e.type==='bomber'){
      e.vx=Math.cos(e.ang)*e.spd;e.vy=Math.sin(e.ang)*e.spd;
      e.fuseT-=eff;
      if(d<e.r+tgt.r+1&&e.atkCd<=0){damagePlayer(tgt,e.dmg);e.atkCd=.8;}
      if(e.fuseT<=0){e._explode=true;}
    } else if(e.type==='shooter'){
      const s=e.spd,w=70;
      if(d<w-10){e.vx=-Math.cos(e.ang)*s;e.vy=-Math.sin(e.ang)*s;}
      else if(d>w+10){e.vx=Math.cos(e.ang)*s;e.vy=Math.sin(e.ang)*s;}
      else{e.vx*=.8;e.vy*=.8;}
      if(d<105&&e.atkCd<=0&&hasLoS(e.x,e.y,tgt.x,tgt.y)){
        ebullets.push({x:e.x,y:e.y,vx:Math.cos(e.ang+rnd(-.05,.05))*90,vy:Math.sin(e.ang+rnd(-.05,.05))*90,life:1.4,dmg:e.dmg});
        e.atkCd=1.4;spark(e.x,e.y,'#f88',3,40);
      }
    } else if(e.type==='zombie'){
      // ── CHAOS: switch ability periodically ──
      if(e.zombiePers==='moody'){
        e._chaosT=(e._chaosT||0)-eff;
        if(e._chaosT<=0){e._chaosT=2.5+Math.random()*2;e._zombieAbility=randPers(true);flash(e.fromName+'! '+e._zombieAbility.toUpperCase(),'#f44');}
      }
      const za=e._zombieAbility||'berserker';

      // ── CORE-EATER (prospector): target cores, eat them ──
      if(za==='prospector'){
        const core=cores.length?cores.reduce((b,c)=>Math.hypot(c.x-e.x,c.y-e.y)<Math.hypot(b.x-e.x,b.y-e.y)?c:b,cores[0]):null;
        if(core){
          const ca=Math.atan2(core.y-e.y,core.x-e.x);
          e.vx=Math.cos(ca)*e.spd;e.vy=Math.sin(ca)*e.spd;
          if(Math.hypot(core.x-e.x,core.y-e.y)<e.r+8){spark(core.x,core.y,'#f80',6,60);cores.splice(cores.indexOf(core),1);flash('CORE EATEN!','#f44');}
          e.fireCd=Math.max(0,(e.fireCd||0)-eff);
          if(d<110&&e.fireCd<=0&&hasLoS(e.x,e.y,tgt.x,tgt.y)){
            const a=Math.atan2(tgt.y-e.y,tgt.x-e.x)+rnd(-e.weapon.spread,e.weapon.spread);
            ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*e.weapon.spd,vy:Math.sin(a)*e.weapon.spd,life:e.weapon.range,dmg:e.weapon.dmg});
            e.fireCd=e.weapon.fireCd;spark(e.x,e.y,'#f80',2,30);
          }
          if(d<e.r+tgt.r+2&&e.atkCd<=0){damagePlayer(tgt,e.dmg);e.atkCd=.5;}
        } else {
          e.vx=Math.cos(e.ang)*e.spd;e.vy=Math.sin(e.ang)*e.spd;
          e.fireCd=Math.max(0,(e.fireCd||0)-eff);
          if(d<130&&e.fireCd<=0&&hasLoS(e.x,e.y,tgt.x,tgt.y)){
            const a=e.ang+rnd(-e.weapon.spread,e.weapon.spread);
            ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*e.weapon.spd,vy:Math.sin(a)*e.weapon.spd,life:e.weapon.range,dmg:e.weapon.dmg});
            e.fireCd=e.weapon.fireCd;spark(e.x,e.y,'#f80',2,30);
          }
          if(d<e.r+tgt.r+1&&e.atkCd<=0){damagePlayer(tgt,e.dmg);e.atkCd=.5;}
        }
      }
      // ── GATEKEEPER (bodyguard): move to exit, block it ──
      else if(za==='bodyguard'){
        const ex=exits[0];
        if(ex&&!e._gateReached){
          const da=Math.atan2(ex.y-e.y,ex.x-e.x);const dd=Math.hypot(ex.x-e.x,ex.y-e.y);
          if(dd>18){e.vx=Math.cos(da)*e.spd;e.vy=Math.sin(da)*e.spd;}
          else{e.vx*=.2;e.vy*=.2;e._gateReached=true;flash(e.fromName+' BLOCKS EXIT!','#f44');}
        } else if(e._gateReached){
          e.vx=0;e.vy=0; // flow field will navigate at full spd when no LoS
          e.fireCd=Math.max(0,(e.fireCd||0)-eff);
          if(d<160&&e.fireCd<=0&&hasLoS(e.x,e.y,tgt.x,tgt.y)){
            const a=Math.atan2(tgt.y-e.y,tgt.x-e.x)+rnd(-.1,.1);
            ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*e.weapon.spd,vy:Math.sin(a)*e.weapon.spd,life:e.weapon.range,dmg:e.weapon.dmg});
            e.fireCd=e.weapon.fireCd;spark(e.x,e.y,'#f88',3,40);
          }
        }
        if(d<e.r+tgt.r+2&&e.atkCd<=0){damagePlayer(tgt,e.dmg*1.5);e.atkCd=.4;}
      }
      // ── WALL-HACK (sniper): wall-penetrating high-damage shots ──
      else if(za==='sniper'){
        if(d>80){e.vx=Math.cos(e.ang)*e.spd*.5;e.vy=Math.sin(e.ang)*e.spd*.5;}
        else{e.vx*=.8;e.vy*=.8;}
        e.fireCd=Math.max(0,(e.fireCd||0)-eff);
        if(d<240&&e.fireCd<=0){
          const a=Math.atan2(tgt.y-e.y,tgt.x-e.x);
          // wall-piercing: no moveObj collision, wallpass flag
          ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*180,vy:Math.sin(a)*180,life:2.2,dmg:e.weapon.dmg*2.8,wallpass:true});
          e.fireCd=2.2;spark(e.x,e.y,'#f00',6,80);shake=Math.max(shake,1.5);
        }
        if(d<e.r+tgt.r+1&&e.atkCd<=0){damagePlayer(tgt,e.dmg);e.atkCd=.5;}
      }
      // ── BLOODHOUND (berserker): 1.5x speed constant chase ──
      else {
        const s=e.spd*1.5;
        e.vx=Math.cos(e.ang)*s;e.vy=Math.sin(e.ang)*s;
        e.fireCd=Math.max(0,(e.fireCd||0)-eff);
        if(d<120&&e.fireCd<=0&&hasLoS(e.x,e.y,tgt.x,tgt.y)){
          const a=e.ang+rnd(-e.weapon.spread,e.weapon.spread);
          ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*e.weapon.spd,vy:Math.sin(a)*e.weapon.spd,life:e.weapon.range,dmg:e.weapon.dmg});
          e.fireCd=e.weapon.fireCd*.7;spark(e.x,e.y,'#f44',2,30);
        }
        if(d<e.r+tgt.r+1&&e.atkCd<=0){damagePlayer(tgt,e.dmg);e.atkCd=.4;e.vx-=Math.cos(e.ang)*40;e.vy-=Math.sin(e.ang)*40;}
      }
    } else if(e.type==='boss'){
      const tier=e._tier||'green';
      // ── Phase 2 trigger at 50% HP ──
      if(!e._phase2&&e.hp<e._maxHp*.5){
        e._phase2=true;
        flash('★ PHASE 2 ★','#f44');flash('ENRAGED!','#f80');
        shake=Math.max(shake,7);
      }
      // ── Final boss: split at 50% HP ──
      if(tier==='final'&&!e._splitDone&&e.hp<e._maxHp*.5){
        e._splitDone=true;
        const copy=Object.assign({},e);
        copy._splitDone=true;copy._gkPhase=null;copy._dashState=null;copy._holdT=0;
        e._isFake=Math.random()<.5;copy._isFake=!e._isFake;
        copy.x=e.x+(Math.random()<.5?-36:36);copy.y=e.y+(Math.random()<.5?-28:28);
        copy.vx=0;copy.vy=0;
        enemies.push(copy);
        flash('IT SPLIT!','#f88');flash('WHICH IS REAL??','#fa8');
        shake=Math.max(shake,8);spark(e.x,e.y,'#f8f',24,120);
      }
      const bSpd=e._phase2?e.spd*1.5:e.spd;
      let skipMove=false;

      // ── Attack 3: wall-breaking dash (red/final) ──
      if(tier==='red'||tier==='final'){
        e._dashCd=Math.max(0,(e._dashCd||5)-eff);
        if(!e._dashState&&e._dashCd<=0&&d>40){
          e._dashState='charging';e._chargeT=.35;
          e._dashVx=Math.cos(e.ang);e._dashVy=Math.sin(e.ang);
          e._dashDistLeft=rnd(120,190);
          spark(e.x,e.y,'#f44',8,80);flash('CHARGE!','#f44');
        }
        if(e._dashState==='charging'){e._chargeT-=eff;if(e._chargeT<=0)e._dashState='dashing';skipMove=true;}
        if(e._dashState==='dashing'){
          const mx=e._dashVx*bSpd*5*eff,my=e._dashVy*bSpd*5*eff;
          e.x+=mx;e.y+=my;e._dashDistLeft-=Math.hypot(mx,my);
          const btxD=(e.x/TILE)|0,btyD=(e.y/TILE)|0;
          for(let dy2=-1;dy2<=1;dy2++)for(let dx2=-1;dx2<=1;dx2++){
            const nx=btxD+dx2,ny=btyD+dy2;
            if(nx<1||ny<1||nx>=MAPW-1||ny>=MAPH-1)continue;
            if(map[ny*MAPW+nx]===1){map[ny*MAPW+nx]=0;fog[ny*MAPW+nx]=1;spark(nx*TILE+8,ny*TILE+8,'#c84',4,55);shake=Math.max(shake,1);}
          }
          for(const p of players){if(p.alive&&Math.hypot(p.x-e.x,p.y-e.y)<e.r+p.r+2&&e.atkCd<=0){damagePlayer(p,Math.round(e.dmg*1.3));e.atkCd=.3;shake=Math.max(shake,4);}}
          const hitOuter=e.x<=TILE*1.5||e.x>=(MAPW-1)*TILE||e.y<=TILE*1.5||e.y>=(MAPH-1)*TILE;
          e.x=Math.max(TILE,Math.min((MAPW-1)*TILE,e.x));e.y=Math.max(TILE,Math.min((MAPH-1)*TILE,e.y));
          if(e._dashDistLeft<=0||hitOuter){e._dashState='recovering';e._recoverT=e._phase2?rnd(.5,.9):rnd(.9,1.4);shake=Math.max(shake,4);spark(e.x,e.y,'#c44',12,90);}
          skipMove=true;
        }
        if(e._dashState==='recovering'){e._recoverT-=eff;if(e._recoverT<=0){e._dashState=null;e._dashCd=e._phase2?rnd(3,5):rnd(5,8);}skipMove=true;}
      }

      // ── Attack 1: GK grab & throw (yellow/red/final) ──
      let huntingGK=false;
      if(tier!=='green'&&!e._dashState){
        e._gkCd=Math.max(0,(e._gkCd||8)-eff);
        if(!e._gkPhase&&e._gkCd<=0&&gatekeepers.length>0){
          let ng=null,nd=Infinity;
          for(const gk of gatekeepers){const dg=Math.hypot(gk.x-e.x,gk.y-e.y);if(dg<nd){nd=dg;ng=gk;}}
          if(ng){e._gkPhase='hunting';e._gkTarget=ng;flash('GK LOCKED!','#f80');}
          else e._gkCd=rnd(3,6);
        }
        if(e._gkPhase==='hunting'){
          const gk=e._gkTarget;
          if(!gk||!gatekeepers.includes(gk)){e._gkPhase=null;e._gkTarget=null;e._gkCd=rnd(5,9);}
          else{
            const da=Math.atan2(gk.y-e.y,gk.x-e.x);
            e.vx=Math.cos(da)*bSpd;e.vy=Math.sin(da)*bSpd;huntingGK=true;
            if(Math.hypot(gk.x-e.x,gk.y-e.y)<e.r+12){
              gatekeepers.splice(gatekeepers.indexOf(gk),1);
              e._gkPhase='holding';e._holdT=rnd(.8,1.4);e._gkTarget=null;
              flash('GK GRABBED!','#f80');shake=Math.max(shake,2);
            }
          }
        }
        if(e._gkPhase==='holding'){
          e._holdT-=eff;
          if(e._holdT<=0){
            const ta=Math.atan2(tgt.y-e.y,tgt.x-e.x);
            ebullets.push({x:e.x,y:e.y,vx:Math.cos(ta)*210,vy:Math.sin(ta)*210,life:1.4,dmg:Math.round(32*eScale()),r:7,_isGK:true});
            e._gkPhase=null;e._gkCd=rnd(12,18);
            spark(e.x,e.y,'#f80',10,80);flash('WATCH OUT!','#f44');shake=Math.max(shake,3);
          }
        }
      }

      // ── Attack 2: 16-way ring shot (yellow/red/final) ──
      if(tier!=='green'&&!huntingGK&&e._gkPhase!=='holding'){
        e._ring16Cd=Math.max(0,(e._ring16Cd||7)-eff);
        if(e._ring16Cd<=0){
          for(let k=0;k<16;k++){const a=k*Math.PI*2/16;ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*95,vy:Math.sin(a)*95,life:1.8,dmg:Math.round(e.dmg*.5)});}
          e._ring16Cd=e._phase2?rnd(4,6):rnd(7,10);
          spark(e.x,e.y,'#ff8',16,80);shake=Math.max(shake,2);
        }
      }

      // ── Standard movement ──
      if(!skipMove&&!huntingGK){e.vx=Math.cos(e.ang)*bSpd;e.vy=Math.sin(e.ang)*bSpd;}
      // Break surrounding wall tiles (all tiers)
      e.breakCd=Math.max(0,(e.breakCd||0)-eff);
      const btx=(e.x/TILE)|0,bty=(e.y/TILE)|0;
      for(let dy2=-1;dy2<=1;dy2++)for(let dx2=-1;dx2<=1;dx2++){
        const nx=btx+dx2,ny=bty+dy2;
        if(nx<1||ny<1||nx>=MAPW-1||ny>=MAPH-1)continue;
        if(map[ny*MAPW+nx]===1){map[ny*MAPW+nx]=0;fog[ny*MAPW+nx]=1;if(e.breakCd<=0){spark(nx*TILE+8,ny*TILE+8,'#c84',6,65);e.breakCd=.1;shake=Math.max(shake,1.5);}}
      }
      // Devour cores
      const coreEatR=e._phase2?e.r+28:e.r+8;
      for(let i=cores.length-1;i>=0;i--){const c=cores[i];if(Math.hypot(c.x-e.x,c.y-e.y)<coreEatR){spark(c.x,c.y,'#f80',4,40);cores.splice(i,1);if(e._phase2)flash('CORE DEVOURED!','#f44');}}
      for(let i=pickups.length-1;i>=0;i--){const pk=pickups[i];if(Math.hypot(pk.x-e.x,pk.y-e.y)<e.r+8){spark(pk.x,pk.y,'#622',3,30);pickups.splice(i,1);}}
      // Green phase 2: 5-way spread shot
      if(tier==='green'&&e._phase2){
        e._shootCd=Math.max(0,(e._shootCd||0)-eff);
        if(e._shootCd<=0){for(let k=-2;k<=2;k++){const a=e.ang+k*.28;ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*115,vy:Math.sin(a)*115,life:1.6,dmg:e.dmg*.55});}e._shootCd=2.2;spark(e.x,e.y,'#f80',8,80);}
      }
      // Smash attack (not during dash)
      if(e._dashState!=='dashing'&&d<e.r+tgt.r+2&&e.atkCd<=0){damagePlayer(tgt,e.dmg);e.atkCd=1.0;shake=Math.max(shake,3);e.vx-=Math.cos(e.ang)*45;e.vy-=Math.sin(e.ang)*45;}
      // Position update (skip if mid-dash — already moved)
      if(e._dashState!=='dashing'){e.x+=e.vx*eff;e.y+=e.vy*eff;}
      e.x=Math.max(TILE,Math.min((MAPW-1)*TILE,e.x));e.y=Math.max(TILE,Math.min((MAPH-1)*TILE,e.y));
      e.hit=Math.max(0,e.hit-eff);e.anim+=eff;
      // boss pushes players away
      for(const p of players){if(!p.alive)continue;const ox=p.x-e.x,oy=p.y-e.y,dd=Math.hypot(ox,oy),mn=e.r+p.r;if(dd>0&&dd<mn){const push=mn-dd;const npx=p.x+ox/dd*push,npy=p.y+oy/dd*push;if(!hitsWall(npx,npy,p.r)){p.x=npx;p.y=npy;}}}
      continue; // skip standard moveObj + enemy separation
    } else {
      e.vx=Math.cos(e.ang)*e.spd;e.vy=Math.sin(e.ang)*e.spd;
      if(hitsWall(e.x+e.vx*.05,e.y+e.vy*.05,e.r)){
        const _a2=e.ang+Math.PI/2,_a3=e.ang-Math.PI/2,_s=e.spd;
        if(!hitsWall(e.x+Math.cos(_a2)*_s*.05,e.y+Math.sin(_a2)*_s*.05,e.r)){e.vx=Math.cos(_a2)*_s*.6;e.vy=Math.sin(_a2)*_s*.6;}
        else{e.vx=Math.cos(_a3)*_s*.6;e.vy=Math.sin(_a3)*_s*.6;}
      }
      if(d<e.r+tgt.r+1&&e.atkCd<=0){damagePlayer(tgt,e.dmg);e.atkCd=.7;e.vx-=Math.cos(e.ang)*55;e.vy-=Math.sin(e.ang)*55;}
    }
    // Flow field: redirect movement through corridors when no LoS (skip wall-passers)
    if(e.type!=='ghost'&&!hasLoS(e.x,e.y,tgt.x,tgt.y)){
      const fi=((e.y/TILE|0)*MAPW+(e.x/TILE|0))*2;
      const fdx=flowField[fi],fdy=flowField[fi+1];
      if(fdx||fdy){const spd=Math.hypot(e.vx,e.vy)||e.spd;const fl=Math.hypot(fdx,fdy);e.vx=fdx/fl*spd;e.vy=fdy/fl*spd;}
      else{if(!e._wanderA||Math.random()<.015)e._wanderA=Math.random()*Math.PI*2;const spd=e.spd*.6;e.vx=Math.cos(e._wanderA)*spd;e.vy=Math.sin(e._wanderA)*spd;}
    }
    if(e.type==='ghost'){e.x+=e.vx*eff;e.y+=e.vy*eff;}
    else if(e.type==='dasher'&&e.dashing){/* already moved */}
    else moveObj(e,eff);
    // Stuck warp: if barely moved for 30s, teleport to random open tile
    const _em=Math.hypot(e.x-(e._wpX??e.x),e.y-(e._wpY??e.y));
    e._wpX=e.x;e._wpY=e.y;
    if(_em<0.5){e._stuckT=(e._stuckT||0)+eff;}else{e._stuckT=0;}
    if(e._stuckT>30&&!tutorialActive){
      const _tiles=[];for(let ty=1;ty<MAPH-1;ty++)for(let tx=1;tx<MAPW-1;tx++){const cx=tx*TILE+TILE/2,cy=ty*TILE+TILE/2;if(!hitsWall(cx,cy,e.r)&&players.every(p=>Math.hypot(p.x-cx,p.y-cy)>60))_tiles.push({x:cx,y:cy});}
      if(_tiles.length){const t=_tiles[Math.random()*_tiles.length|0];smoke(e.x,e.y);e.x=t.x;e.y=t.y;smoke(e.x,e.y);}
      e._stuckT=0;
    }
    // separation: enemy-enemy
    for(const o of enemies){if(o===e)continue;const ox=e.x-o.x,oy=e.y-o.y,dd=Math.hypot(ox,oy),mn=e.r+o.r;if(dd>0&&dd<mn){const push=(mn-dd)*.5;const nx=e.x+ox/dd*push,ny=e.y+oy/dd*push;if(!hitsWall(nx,ny,e.r)){e.x=nx;e.y=ny;}}}
    // separation: enemy-player (both directions)
    for(const p of players){if(!p.alive)continue;const ox=e.x-p.x,oy=e.y-p.y,dd=Math.hypot(ox,oy),mn=e.r+p.r;if(dd>0&&dd<mn){const push=(mn-dd)*.5;e.x+=ox/dd*push;e.y+=oy/dd*push;const npx=p.x-ox/dd*push,npy=p.y-oy/dd*push;if(!hitsWall(npx,npy,p.r)){p.x=npx;p.y=npy;}}}
  }

  // ── Ghost: parry kill ──
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];if(e.type!=='ghost')continue;
    for(const p of players){
      if(!p.alive||p.parryT<=0)continue;
      if(Math.hypot(e.x-p.x,e.y-p.y)<22){
        enemies.splice(i,1);totalKills++;
        spark(e.x,e.y,'#adf',12,70);SE.kill();
        flash('BANISHED!','#adf');break;
      }
    }
  }

  // ── Flung enemies (dash-cancel parry knockback + chain collision) ──
  for(const e of enemies){
    if(!e._flung||e._flung<=0)continue;
    e._flung-=dt;
    e._flungVx*=Math.max(0,1-dt*5);e._flungVy*=Math.max(0,1-dt*5);
    const nx=e.x+e._flungVx*dt,ny=e.y+e._flungVy*dt;
    if(hitsWall(nx,ny,e.r)){e._flung=0;e._flungVx=0;e._flungVy=0;}
    else{e.x=nx;e.y=ny;}
    // Chain: bowl into other enemies
    for(const t2 of enemies){
      if(t2===e||t2._flung>0)continue;
      if(Math.hypot(t2.x-e.x,t2.y-e.y)<e.r+t2.r+1){
        const ca=Math.atan2(t2.y-e.y,t2.x-e.x);
        t2.hp-=80;t2.hit=.15;
        t2._flungVx=Math.cos(ca)*130;t2._flungVy=Math.sin(ca)*130;t2._flung=0.5;
        spark(t2.x,t2.y,'#f80',8,80);shake=Math.max(shake,2);
      }
    }
  }

  // ── Bomber: explosion ──
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];if(!e._explode)continue;
    enemies.splice(i,1);totalKills++;
    const expR=44;
    spark(e.x,e.y,'#f80',24,140);spark(e.x,e.y,'#f44',12,80);smoke(e.x,e.y);shake=Math.max(shake,6);SE.bossDeath();
    // damage players
    for(const p of players){if(p.alive&&Math.hypot(p.x-e.x,p.y-e.y)<expR)damagePlayer(p,Math.round(28*eScale()));}
    // damage other enemies
    for(let j=enemies.length-1;j>=0;j--){
      const e2=enemies[j];if(Math.hypot(e2.x-e.x,e2.y-e.y)<expR){e2.hp-=20*eScale();e2.hit=.2;if(e2.hp<=0){enemies.splice(j,1);totalKills++;spark(e2.x,e2.y,'#f44',6,60);}}
    }
    // destroy wall tiles
    const tr=Math.ceil(expR/TILE),etx=(e.x/TILE)|0,ety=(e.y/TILE)|0;
    for(let ty=ety-tr;ty<=ety+tr;ty++)for(let tx=etx-tr;tx<=etx+tr;tx++){
      if(tx<1||ty<1||tx>=MAPW-1||ty>=MAPH-1)continue;
      if(Math.hypot(tx*TILE+8-e.x,ty*TILE+8-e.y)<expR&&map[ty*MAPW+tx]===1)map[ty*MAPW+tx]=0;
    }
  }

  // ── Gatekeepers ──
  for(const gk of gatekeepers){
    if(gk.hit>0)gk.hit=Math.max(0,gk.hit-eff);
    gk.cd-=eff;
    if(gk.cd<=0){
      gk.cd=2.5;
      for(let a=0;a<8;a++){const ang=a*Math.PI/4;ebullets.push({x:gk.x,y:gk.y,vx:Math.cos(ang)*80,vy:Math.sin(ang)*80,life:1.8,dmg:8});}
      spark(gk.x,gk.y,'#f44',8,60);
    }
    // contact damage + knockback
    for(const p of players){
      if(!p.alive||p.iframe>0)continue;
      const dx=p.x-gk.x,dy=p.y-gk.y,dist=Math.hypot(dx,dy);
      if(dist<8){
        damagePlayer(p,15);
        p.iframe=.6;
        // push player away
        const nx=dist>0?dx/dist:1,ny=dist>0?dy/dist:0;
        const pushDist=18;
        const px2=p.x+nx*pushDist,py2=p.y+ny*pushDist;
        if(!hitsWall(px2,p.y,p.r))p.x=px2;
        if(!hitsWall(p.x,py2,p.r))p.y=py2;
        spark(p.x,p.y,'#f44',5,55);
      }
    }
  }

  // ── Poison puddles ──
  for(let i=poisonPuddles.length-1;i>=0;i--){
    const pd=poisonPuddles[i];pd.t-=eff;
    if(pd.t<=0){poisonPuddles.splice(i,1);continue;}
    pd.damageCd=(pd.damageCd||0)-eff;
    for(const p of players){
      if(!p.alive)continue;
      if((p.x-pd.x)**2+(p.y-pd.y)**2<10*10){
        if(pd.damageCd<=0){damagePlayer(p,3);pd.damageCd=0.5;}
      }
    }
  }

  // ── NPC state machine (disabled) ──
  // for(let i=npcs.length-1;i>=0;i--){
  //   const npc=npcs[i];
  //   if(npc.state==='idle'){
  //     let near=false;
  //     for(const p of players){if(p.alive&&Math.hypot(p.x-npc.x,p.y-npc.y)<24){near=true;break;}}
  //     if(near){
  //       npc.talkT+=eff;
  //       npc.msg='...ODD TO FIND ANOTHER FOOL DOWN HERE';
  //       if(npc.talkT>2.5&&!npc.hasSpokenFollow){
  //         npc.hasSpokenFollow=true;
  //         npc.msg='FOLLOW ME.';
  //         setTimeout(()=>{
  //           if(npc.state==='idle'){npc.state='leading';npc.dir=Math.random()*Math.PI*2;npc.msg='';}
  //         },1800);
  //       }
  //     }else{if(!npc.hasSpokenFollow)npc.msg='';}
  //   }else if(npc.state==='leading'){
  //     npc.leadT+=eff;
  //     const spd=28,nx=npc.x+Math.cos(npc.dir)*spd*eff,ny=npc.y+Math.sin(npc.dir)*spd*eff;
  //     if(!hitsWall(nx,ny,2)){npc.x=nx;npc.y=ny;}else{npc.dir+=Math.PI*.5+rnd(-.3,.3);}
  //     npc.msg=(npc.leadT%4<.6)?'THIS WAY!':'';
  //     if(npc.leadT>npc.leadDur){
  //       SE.npcFall();flash('AAAAGGH!!','#fa4');
  //       const lootTypes=['core','core','core','health','health'];
  //       for(let j=0;j<2+rndi(0,3);j++){const ang=Math.random()*Math.PI*2,d=rnd(6,20);pickups.push({type:lootTypes[rndi(0,lootTypes.length)],x:npc.x+Math.cos(ang)*d,y:npc.y+Math.sin(ang)*d,t:0});}
  //       for(let j=0;j<16;j++){const ang=Math.random()*Math.PI*2;particles.push({x:npc.x,y:npc.y,vx:Math.cos(ang)*rnd(8,28),vy:Math.sin(ang)*rnd(8,28),life:rnd(.5,1.4),c:j%3===0?'#543':'#321'});}
  //       npcs.splice(i,1);
  //     }
  //   }
  // }

  // ── Pickups ──
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];p.t+=eff;
    for(const pl of players){if(!pl.alive)continue;const dx=pl.x-p.x,dy=pl.y-p.y;
      if(dx*dx+dy*dy<36){
        if(p.type==='core'){coresCollected++;flash('CORE '+coresCollected+'/'+coresNeeded,'#0ff');}
        else if(p.type==='health'){pl.hp=Math.min(pl.maxHp,pl.hp+25);flash(pl.pal.name+' +25HP',pl.pal.body);}
        else if(p.type==='revive'){if(!pl.isHuman)continue;pl.hasRevive=true;flash(pl.pal.name+' GOT REVIVE!','#ff0');spark(pl.x,pl.y,'#ff0',12,100);}
        pickups.splice(i,1);break;
      }
    }
  }
  // World cores
  for(let i=cores.length-1;i>=0;i--){
    const c=cores[i];c.t+=eff;
    for(const pl of players){if(!pl.alive)continue;const dx=pl.x-c.x,dy=pl.y-c.y;
      if(dx*dx+dy*dy<64){cores.splice(i,1);coresCollected++;flash('CORE '+coresCollected+'/'+coresNeeded,'#0ff');break;}
    }
  }
  {const _bossAlive=enemies.some(e=>e.type==='boss');
  if(!monsterHouse&&!exitOpen&&coresCollected>=coresNeeded&&!_bossAlive){exitOpen=true;flash('EXIT OPEN','#ff0');}}

  // ── Cold sleep pods ──
  // Update active pod selection
  if(podSelectState){
    const ps=podSelectState;
    const adx=ps.activator.x-ps.pod.x,ady=ps.activator.y-ps.pod.y;
    if(!ps.activator.alive||adx*adx+ady*ady>144){podSelectState=null;_podPadPrev={};}
    else{
      ps.moveCd=(ps.moveCd||0)-dt;
      const gps=navigator.getGamepads?navigator.getGamepads():[];
      let gp=null;for(let i=0;i<gps.length;i++)if(gps[i]){gp=gps[i];break;}
      const edge=(k,v)=>{const r=v&&!_podPadPrev[k];_podPadPrev[k]=!!v;return r;};
      const ax=gp?gp.axes[0]||0:0;
      const left=edge('L',keys.ArrowLeft||(gp&&((gp.buttons[14]?.pressed)||ax<-.5)));
      const right=edge('R',keys.ArrowRight||(gp&&((gp.buttons[15]?.pressed)||ax>.5)));
      const confirm=edge('A',(keys.Enter||keys.NumpadEnter)||(gp&&gp.buttons[0]?.pressed));
      const cancel=edge('B',keys.Escape||(gp&&gp.buttons[1]?.pressed));
      if(left||right){ps.cursor=((ps.cursor+(right?1:-1))+ps.candidates.length)%ps.candidates.length;}
      if(confirm){
        const dead=ps.candidates[ps.cursor];
        ps.pod.used=true;
        dead.alive=true;dead.hp=dead.maxHp*.5;dead.iframe=1;
        dead.x=ps.pod.x+rnd(-10,10);dead.y=ps.pod.y+rnd(-10,10);
        const newPers=randPers();
        dead.controller=new CPUController(newPers);
        spark(ps.pod.x,ps.pod.y,'#0ff',16,80);
        flash('COLD SLEEP: '+dead.pal.name+' REVIVED','#0ff');
        flash(dead.pal.name+': '+PERS_LABEL[newPers],dead.pal.body);
        podSelectState=null;_podPadPrev={};
      }
      if(cancel){podSelectState=null;_podPadPrev={};}
    }
  }
  for(const pod of pods){
    if(pod.used)continue;
    pod.t+=eff;
    for(const pl of players){if(!pl.alive||!pl.isHuman)continue;const dx=pl.x-pod.x,dy=pl.y-pod.y;
      if(dx*dx+dy*dy<64){
        const deadCPUs=players.filter(p=>!p.alive&&!p.isHuman);
        if(deadCPUs.length===0)break;
        if(deadCPUs.length===1){
          pod.used=true;
          const dead=deadCPUs[0];
          dead.alive=true;dead.hp=dead.maxHp*.5;dead.iframe=1;
          dead.x=pod.x+rnd(-10,10);dead.y=pod.y+rnd(-10,10);
          const newPers=randPers();
          dead.controller=new CPUController(newPers);
          spark(pod.x,pod.y,'#0ff',16,80);
          flash('COLD SLEEP: '+dead.pal.name+' REVIVED','#0ff');
          flash(dead.pal.name+': '+PERS_LABEL[newPers],dead.pal.body);
        }else if(!podSelectState||podSelectState.pod!==pod){
          podSelectState={pod,candidates:deadCPUs,cursor:0,activator:pl};
        }
        break;
      }
    }
  }

  // ── Exit / Screw ──
  if(exitOpen&&exits[0]){
    const ex=exits[0];
    for(const pl of players){if(!pl.alive||!pl.isHuman)continue;const dx=pl.x-ex.x,dy=pl.y-ex.y;
      if(dx*dx+dy*dy<80){
        if(stage===MAX_DEPTH){/* screw handled below */}
        else if(stage%10===0&&!attractDemo){startCoffeeBreak();return;}
        else{nextStage();return;}
      }
    }
  }
  if(screwObj){
    screwObj.t+=eff;
    for(const pl of players){if(!pl.alive)continue;const dx=pl.x-screwObj.x,dy=pl.y-screwObj.y;
      if(dx*dx+dy*dy<64){gameCleared();return;}
    }
  }

  // ── Particles / messages ──
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*eff;p.y+=p.vy*eff;p.vx*=.96;p.vy*=.96;if(p.sm)p.vy-=30*eff;p.life-=eff;if(p.life<=0)particles.splice(i,1);
  }
  for(let i=messages.length-1;i>=0;i--){messages[i].t+=dt;if(messages[i].t>2.2)messages.splice(i,1);}
  shake*=Math.pow(.001,dt);

  // ── Camera: follow human player only, with aim look-ahead ──
  const _fp=players.find(p=>p.alive&&p.isHuman)||players.find(p=>p.alive);
  if(_fp){
    const tx=_fp.x+Math.cos(_fp.aim)*14,ty=_fp.y+Math.sin(_fp.aim)*14;
    camX+=(tx-camX)*Math.min(1,dt*6);camY+=(ty-camY)*Math.min(1,dt*6);
  }

  // ── Game over ──
  const _goCheck=attractDemo?!players.some(p=>p.alive):!players.some(p=>p.alive&&p.isHuman);
  if(_goCheck){running=false;gameOver();}
}

function damagePlayer(p,d){
  if(p.iframe>0)return;
  p.hp-=d;p.iframe=.4;shake=Math.max(shake,2);blood(p.x,p.y);
  if(!p.isHuman)p._hit=true;
  if(p.hp<=0){
    // Revive item auto-activates
    if(p.hasRevive){
      p.hp=Math.ceil(p.maxHp*.5);p.hasRevive=false;p.iframe=1.5;
      flash(p.pal.name+' REVIVED!','#ff0');
      spark(p.x,p.y,'#ff0',20,150);spark(p.x,p.y,'#fff',8,80);
      shake=Math.max(shake,3);return;
    }
    p.hp=0;p.alive=false;
    if(!p.isHuman){
      // trigger bullet time
      bulletTime={timer:3.5,victimName:p.pal.name,victimPal:p.pal};
      setTimeout(()=>{if(bulletTime)flash('ZOMBIE RISING','#f44');},500);
      if(!attractDemo)saveGame(); // lock in death immediately — quit+continue can't undo it
    }
    enemies.push(makeZombie(p));
    flash(p.pal.name+' TURNED!','#f44');
    spark(p.x,p.y,'#c22',20,120);
  }
}

function mhEnemyType(){
  const r=Math.random();
  if(stage>=60)return r<.25?'brute':r<.6?'shooter':'runner';
  if(stage>=30)return r<.3?'runner':r<.65?'shooter':'grunt';
  return r<.5?'grunt':r<.8?'runner':'shooter';
}
function spawnMH(){
  // Spawn enemy anywhere in open arena, away from center
  const cx=(MAPW>>1)*TILE+8,cy=(MAPH>>1)*TILE+8;
  for(let t=0;t<200;t++){
    const tx=rndi(2,MAPW-2),ty=rndi(2,MAPH-2);
    if(map[ty*MAPW+tx]!==0&&map[ty*MAPW+tx]!==2)continue;
    const wx=tx*TILE+8,wy=ty*TILE+8;
    if(Math.hypot(wx-cx,wy-cy)<60)continue;
    enemies.push(makeEnemy(mhEnemyType(),wx,wy));return;
  }
}

function nextStage(){
  const wasMH=monsterHouse;
  stage++;
  // Determine monster house for new stage
  const isBoss=stage%10===0||stage===99;
  monsterHouse=!isBoss&&stage>1&&!wasMH&&Math.random()<0.1;
  monsterHouseCleared=false;
  if(monsterHouse)mhSpawnPending=1; // prevent premature clear before spawn timeout fires
  if(!attractDemo)PSG.play(stage);saveGame();
  // Re-roll moody sub-ability each floor
  const msgs=[];
  for(const p of players){
    if(!p.alive||p.isHuman)continue;
    if(p.controller.personality==='moody'){
      p.controller.rerollMoody();
      msgs.push(p.pal.name+' MOODY:'+p.controller.ability);
    }
  }
  bullets=[];ebullets=[];enemies=[];particles=[];pickups=[];messages=[];
  genMap();spawnT=.5;
  for(const p of players){if(!p.alive)continue;p.fireCd=0;p.iframe=1;}
  let cx=0,cy=0,n=0;for(const p of players){if(!p.alive)continue;cx+=p.x;cy+=p.y;n++;}
  if(n){camX=cx/n;camY=cy/n;}
  flash('DEPTH '+stage,stage===MAX_DEPTH?'#ff0':'#0ff');
  if(stage===MAX_DEPTH)flash('THE SCREW AWAITS','#ff0');
  if(secretWallPos)flash('DRIVER HIDDEN THIS FLOOR','#ffd700');
  setTimeout(()=>{for(const m of msgs)flash(m,'#fa0');},600);
  // Monster house: announce immediately, spawn after brief delay
  if(monsterHouse){
    flash('!! MONSTER HOUSE !!','#f44');
    flash('EXTERMINATE ALL','#f88');
    shake=Math.max(shake,4);
    if(!attractDemo)PSG.mhouse(stage);
    setTimeout(()=>{
      if(!running)return;
      const count=Math.min(40,Math.round(20+stage*.2));
      mhSpawnPending=count;
      for(let i=0;i<count;i++)setTimeout(()=>{mhSpawnPending--;if(running&&!monsterHouseCleared)spawnMH();},200+i*120);
    },400);
  }
  // Spawn boss on multiples of 10 and D99
  if(stage%10===0||stage===99){
    setTimeout(()=>{
      if(!running)return;
      const b=makeBoss();enemies.push(b);
      flash('★ BOSS APPROACHES ★','#f44');
      const _bMsg={green:'WALL-BREAKER INCOMING',yellow:'GK-THROWER INCOMING',red:'JUGGERNAUT INCOMING',final:'THE FINAL TERROR'}[b._tier]||'BOSS INCOMING';
      flash(_bMsg,'#f88');
      flash('DEFEAT THE BOSS TO OPEN THE EXIT!','#fa0');
      if(exitOpen){exitOpen=false;}
      shake=Math.max(shake,3);
      if(!attractDemo)PSG.boss(stage);
    },1200);
  }
}

function callCPU(){
  if(callCooldown>0||!running||paused)return;
  const hp=humanPlayer();if(!hp)return;
  let called=0;
  for(const p of players){if(!p.alive||p.isHuman)continue;p.rushing=true;called++;}
  if(!called){flash('NO ALLIES','#555');return;}
  callCooldown=60;callAggroTimer=8;
  flash('CALLING ALLIES!','#0ff');
  spark(hp.x,hp.y,'#0ff',16,110);
}
function _saveBest(){
  const prev=+(localStorage.getItem('lores_best')||0);
  if(stage>prev){localStorage.setItem('lores_best',stage);return true;}
  return false;
}
function gameOver(){
  PSG.stop();clearSave();
  gameOverState=true;_goT=0;
  const newRecord=!attractDemo&&_saveBest();
  gameOverMsg='DEPTH:'+stage+'  KILLS:'+totalKills+(newRecord?' *NEW BEST*':'');
}
function gameCleared(){
  PSG.stop();clearSave();running=false;gameWon=true;endingT=0;
  if(!attractDemo)_saveBest();
  winMsg='DEPTH '+stage+' / KILLS '+totalKills+' / ALLIES '+players.filter(p=>p.alive&&!p.isHuman).length+' SURVIVED';
}


// ═══════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(!map)return;
  ctx.save();
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  ctx.translate(Math.round(-camX+W/2+sx),Math.round(-camY+H/2+sy));

  const xr=((camX-W/2)/TILE)|0,yr=((camY-H/2)/TILE)|0;
  const x0=Math.max(0,xr-1),y0=Math.max(0,yr-1);
  const x1=Math.min(MAPW-1,xr+(W/TILE|0)+3),y1=Math.min(MAPH-1,yr+(H/TILE|0)+3);

  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const t=map[y*MAPW+x],px=x*TILE,py=y*TILE;
    const wp=wallPal();
    if(t===1||t===4){
      ctx.fillStyle=wp.base;ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle=wp.top;ctx.fillRect(px,py,TILE,3);
      ctx.fillStyle=wp.bot;ctx.fillRect(px,py+TILE-3,TILE,3);
      ctx.fillStyle=wp.side;ctx.fillRect(px+TILE-2,py+3,2,TILE-6);
      if(((x*7+y*13)&3)===0){ctx.fillStyle=wp.acc;ctx.fillRect(px+3,py+5,2,2);}
      // Secret wall: subtle gold glint that pulses
      if(t===4){const g=(Math.sin(time*3+x*.7+y*.5)+1)*.5;if(g>.7){ctx.fillStyle='#b8860b';ctx.fillRect(px+5,py+6,2,2);}}
    }else{
      ctx.fillStyle=((x+y)&1)?wp.f1:wp.f2;ctx.fillRect(px,py,TILE,TILE);
      if(t===2){ctx.fillStyle=wp.fd;ctx.fillRect(px+2,py+2,4,4);ctx.fillRect(px+10,py+9,3,3);}
      else if(t===3){ctx.fillStyle=wp.bot;ctx.fillRect(px+4,py+7,8,1);ctx.fillRect(px+6,py+8,4,1);}
      ctx.fillStyle=wp.f2;ctx.fillRect(px,py,1,1);
    }
  }

  // EXIT
  const ex=exits[0];
  if(ex){
    const pu=(Math.sin(time*6)+1)*.5;
    ctx.fillStyle=exitOpen?`rgb(${50+200*pu|0},${200+50*pu|0},80)`:'#552';ctx.fillRect(ex.x-7,ex.y-7,14,14);
    ctx.fillStyle=exitOpen?'#ff0':'#332';ctx.fillRect(ex.x-5,ex.y-5,10,10);
    ctx.fillStyle='#000';ctx.fillRect(ex.x-1,ex.y-3,2,6);ctx.fillRect(ex.x-2,ex.y-2,1,1);ctx.fillRect(ex.x+1,ex.y-2,1,1);
  }

  // SCREW (DEPTH 100)
  if(screwObj){
    const pulse=(Math.sin(time*8)+1)*.5;
    ctx.fillStyle='#ff0';ctx.globalAlpha=.6+pulse*.4;
    ctx.fillRect(screwObj.x-4,screwObj.y-4,8,8);
    ctx.fillStyle='#fff';ctx.fillRect(screwObj.x-2,screwObj.y-2,4,4);
    ctx.fillStyle='#000';ctx.fillRect(screwObj.x-1,screwObj.y,2,1);ctx.fillRect(screwObj.x,screwObj.y-1,1,2);
    ctx.globalAlpha=1;
    pixText('SCREW',(screwObj.x-10)|0,(screwObj.y-12)|0,'#ff0');
  }

  // NPCs (disabled)
  // for(const npc of npcs){
  //   ctx.fillStyle=npc.pal.body;ctx.fillRect(npc.x-2,npc.y-3,4,6);
  //   ctx.fillStyle=npc.pal.head;ctx.fillRect(npc.x-2,npc.y-5,4,3);
  //   ctx.fillStyle='#000';ctx.fillRect(npc.x-1,npc.y-4,1,1);ctx.fillRect(npc.x,npc.y-4,1,1);
  //   ctx.fillStyle=npc.pal.dark;ctx.fillRect(npc.x-2,npc.y+3,1,2);ctx.fillRect(npc.x+1,npc.y+3,1,2);
  //   if(npc.msg){
  //     const bw=npc.msg.length*4+6,bh=11;
  //     const bx=(npc.x-bw/2)|0,by=npc.y-22;
  //     ctx.fillStyle='#111';ctx.fillRect(bx,by,bw,bh);
  //     ctx.strokeStyle='#888';ctx.lineWidth=1;ctx.strokeRect(bx+.5,by+.5,bw-1,bh-1);
  //     pixText(npc.msg,bx+3,by+3,'#ddd');
  //   }
  // }

// POISON PUDDLES
  for(const pd of poisonPuddles){
    const a=Math.min(.55,pd.t/6*.55);
    ctx.fillStyle='#3a0';ctx.globalAlpha=a;
    ctx.fillRect(pd.x-8,pd.y-5,16,10);
    ctx.fillStyle='#6f2';ctx.globalAlpha=a*.7;
    ctx.fillRect(pd.x-5,pd.y-7,10,14);
    ctx.globalAlpha=1;
  }

  // GATEKEEPERS
  for(const gk of gatekeepers){
    const pulse=(Math.sin(performance.now()*.003)+1)*.5;
    const flashing=gk.hit>0;
    ctx.fillStyle=flashing?'#fff':'#600';ctx.fillRect(gk.x-6,gk.y-6,12,12);
    ctx.fillStyle=flashing?'#fff':'#f44';ctx.globalAlpha=flashing?1:.5+pulse*.5;
    ctx.fillRect(gk.x-4,gk.y-4,8,8);
    ctx.globalAlpha=1;
    ctx.fillStyle=flashing?'#fff':'#f88';
    ctx.fillRect(gk.x-1,gk.y-6,2,12);ctx.fillRect(gk.x-6,gk.y-1,12,2);
  }

  // COLD SLEEP POD
  for(const pod of pods){
    if(pod.used)continue;pod.t=(pod.t||0);
    const f=(Math.sin(pod.t*3)+1)*.5;
    ctx.fillStyle='#0af';ctx.globalAlpha=.5+f*.5;
    ctx.fillRect(pod.x-5,pod.y-7,10,14);
    ctx.fillStyle='#8ff';ctx.fillRect(pod.x-3,pod.y-5,6,10);
    ctx.fillStyle='#fff';ctx.fillRect(pod.x-1,pod.y-3,2,6);ctx.fillRect(pod.x-3,pod.y-1,6,2);
    ctx.globalAlpha=1;
    pixText('POD',(pod.x-6)|0,(pod.y-14)|0,'#0af');
  }

  // World cores
  for(const c of cores){
    const f=(Math.sin(c.t*4+(c.x+c.y)*.1)+1)*.5;
    ctx.fillStyle='#066';ctx.fillRect(c.x-3,c.y-3+f,6,6);
    ctx.fillStyle='#0ff';ctx.fillRect(c.x-2,c.y-2+f,4,4);
    ctx.fillStyle='#fff';ctx.fillRect(c.x-1,c.y-1+f,1,1);
  }

  // Dropped pickups
  for(const p of pickups){
    const yo=Math.sin(p.t*5+p.x)*1;
    if(p.type==='core'){ctx.fillStyle='#0ff';ctx.fillRect(p.x-2,p.y-2+yo,4,4);ctx.fillStyle='#fff';ctx.fillRect(p.x-1,p.y-1+yo,1,1);}
    else if(p.type==='health'){ctx.fillStyle='#0f4';ctx.fillRect(p.x-2,p.y-1+yo,4,2);ctx.fillRect(p.x-1,p.y-2+yo,2,4);}
    else if(p.type==='revive'){
      const pulse=Math.abs(Math.sin(time*4));
      ctx.fillStyle='#ff0';ctx.globalAlpha=0.5+pulse*0.5;
      // star shape
      ctx.fillRect(p.x-3,p.y-1+yo,6,2);ctx.fillRect(p.x-1,p.y-3+yo,2,6);
      ctx.fillRect(p.x-2,p.y-2+yo,1,1);ctx.fillRect(p.x+1,p.y-2+yo,1,1);
      ctx.fillRect(p.x-2,p.y+1+yo,1,1);ctx.fillRect(p.x+1,p.y+1+yo,1,1);
      ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(p.x-1,p.y-1+yo,2,2);
    }
  }

  // Smoke
  for(const p of particles){if(!p.sm)continue;ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,p.life/.8)*.6;ctx.fillRect(p.x|0,p.y|0,2,2);}
  ctx.globalAlpha=1;

  // Player bullets
  for(const b of bullets){
    const trC=b.pierce>0?'#0cf':b.owner?b.owner.pal.trail:'#fb4';
    const trW=b.charge?Math.max(2,Math.ceil((b.r||1.5)*.6)):1;
    for(let i=0;i<b.trail.length;i++){ctx.globalAlpha=(i+1)/b.trail.length*.7;ctx.fillStyle=trC;ctx.fillRect(b.trail[i].x|0,b.trail[i].y|0,trW,trW);}
    ctx.globalAlpha=1;
    if(b.charge){
      const sz=Math.max(2,Math.ceil(b.r||1.5)),bx2=(b.x|0)-sz,by2=(b.y|0)-sz,bs=sz*2;
      const pw=b.power||0;
      ctx.globalAlpha=0.35;ctx.fillStyle='#ff0';ctx.fillRect(bx2-1,by2-1,bs+2,bs+2);
      ctx.globalAlpha=1;ctx.fillStyle=pw<0.5?'#ff8':'#f80';ctx.fillRect(bx2,by2,bs,bs);
      ctx.fillStyle='#fff';ctx.fillRect((b.x|0)-1,(b.y|0)-1,2,2);
    } else if(b.pierce>0){
      ctx.fillStyle='#0ff';ctx.fillRect((b.x|0)-1,(b.y|0)-1,2,2);
      ctx.fillStyle='#fff';ctx.fillRect(b.x|0,b.y|0,1,1);
    } else {
      ctx.fillStyle='#ffe';ctx.fillRect((b.x|0)-1,(b.y|0)-1,2,2);
    }
  }
  // Enemy bullets
  for(const b of ebullets){
    if(b._isGK){
      // Thrown gatekeeper — large cyan projectile
      ctx.fillStyle='#08a';ctx.fillRect((b.x|0)-3,(b.y|0)-3,7,7);
      ctx.fillStyle='#0cf';ctx.fillRect((b.x|0)-2,(b.y|0)-2,5,5);
      ctx.fillStyle='#fff';ctx.fillRect((b.x|0)-1,(b.y|0)-1,1,1);
    }else if(b.wallpass){ctx.fillStyle='#fff';ctx.fillRect((b.x|0)-2,(b.y|0)-2,4,4);ctx.fillStyle='#f0f';ctx.fillRect((b.x|0)-1,(b.y|0)-1,2,2);}
    else{ctx.fillStyle='#f44';ctx.fillRect((b.x|0)-1,(b.y|0)-1,2,2);ctx.fillStyle='#fa6';ctx.fillRect(b.x|0,b.y|0,1,1);}
  }

  for(const e of enemies)drawEnemy(e);
  for(const p of players)if(p.alive)drawPlayer(p);
  // Shield orbs
  for(const p of players){
    if(!p.alive||!p.shields||!p.shields.length)continue;
    const n=p.shields.length;
    for(let si=0;si<n;si++){
      const sang=p.shieldAngle+si*(Math.PI*2/n);
      const sx=(p.x+Math.cos(sang)*10)|0,sy=(p.y+Math.sin(sang)*10)|0;
      const ratio=p.shields[si].hp/p.shields[si].maxHp;
      // glow
      ctx.globalAlpha=0.25+ratio*.2;ctx.fillStyle='#0cf';ctx.fillRect(sx-3,sy-3,7,7);
      // core
      ctx.globalAlpha=1;
      ctx.fillStyle=ratio>0.66?'#0ff':ratio>0.33?'#0bb':'#088';
      ctx.fillRect(sx-1,sy-1,3,3);
      ctx.fillStyle='#fff';ctx.fillRect(sx,sy,1,1);
    }
    ctx.globalAlpha=1;
  }

  // Sparks
  for(const p of particles){if(p.sm)continue;ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,p.life/.5);ctx.fillRect(p.x|0,p.y|0,2,2);}
  ctx.globalAlpha=1;

  // Crosshair (KB+M player)
  const kmp=players.find(p=>p.alive&&p.controller?.type==='KB+M');
  if(kmp){const x=Math.round(mouse.x+camX-W/2),y=Math.round(mouse.y+camY-H/2);ctx.fillStyle='#fff';ctx.fillRect(x-3,y,2,1);ctx.fillRect(x+2,y,2,1);ctx.fillRect(x,y-3,1,2);ctx.fillRect(x,y+2,1,2);ctx.fillStyle='#f44';ctx.fillRect(x,y,1,1);}

  ctx.restore();

  drawOffscreenIndicators();
  drawMinimap();
  drawHUD();

  // Bullet time colour grading
  if(bulletTime){
    const g=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,140);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(200,0,0,.35)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }

  // Pod revival selection UI
  if(podSelectState){
    const ps=podSelectState;
    const sx=(ps.pod.x-camX+W/2)|0,sy=(ps.pod.y-camY+H/2)|0;
    const sel=ps.candidates[ps.cursor];
    const name=sel.pal.name;
    const bw=Math.max(52,name.length*4+24),bh=22;
    const bx=(sx-bw/2)|0,by=sy-38;
    ctx.fillStyle='#001a1a';ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle='#0ff';ctx.lineWidth=1;ctx.strokeRect(bx+.5,by+.5,bw-1,bh-1);
    pixText('REVIVE?',bx+((bw-7*4)/2)|0,by+2,'#0ff');
    if(ps.candidates.length>1){
      pixText('◄',(bx+3)|0,by+11,'#0af');
      pixText('►',(bx+bw-7)|0,by+11,'#0af');
    }
    pixText(name,(bx+(bw-name.length*4)/2)|0,by+11,sel.pal.body);
  }

  // Pause dim
  if(paused){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);}

  // Scanlines
  ctx.fillStyle='#000';ctx.globalAlpha=.18;
  for(let y=0;y<H;y+=2)ctx.fillRect(0,y,W,1);
  ctx.globalAlpha=1;
}

function drawPlayer(p){
  const x=Math.round(p.x),y=Math.round(p.y),a=p.aim||0;
  ctx.fillStyle='#000';ctx.globalAlpha=.4;ctx.fillRect(x-3,y+2,6,2);ctx.globalAlpha=1;
  let bc=p.pal.body;
  if(p.iframe>0&&((time*30)|0)%2===0)bc='#fff';
  if(p._dcpFlash>0){ctx.fillStyle='#fff';ctx.globalAlpha=0.85;ctx.fillRect(x-4,y-6,8,10);ctx.globalAlpha=1;bc='#fff';}
  const pers=p.controller?.personality;
  // Body — bodyguard is 1px wider
  const bw=pers==='bodyguard'?5:4;
  ctx.fillStyle=bc;ctx.fillRect(x-Math.floor(bw/2),y-3,bw,6);
  // Head — berserker is 1px wider
  const hw=pers==='berserker'?5:4;
  ctx.fillStyle=p.pal.head;ctx.fillRect(x-Math.floor(hw/2),y-5,hw,3);
  ctx.fillStyle='#000';ctx.fillRect(x-1,y-4,1,1);ctx.fillRect(x,y-4,1,1);
  // Berserker: angry brow pixel
  if(pers==='berserker'){ctx.fillStyle='#000';ctx.fillRect(x-2,y-5,1,1);ctx.fillRect(x+1,y-5,1,1);}
  const moving=(p.vx*p.vx+p.vy*p.vy)>2,bob=moving?((time*16+p.idx*3)|0)%2:0;
  ctx.fillStyle=p.pal.dark;ctx.fillRect(x-Math.floor(bw/2),y+3,1,2-bob);ctx.fillRect(x+Math.floor(bw/2)-1,y+3,1,1+bob);
  const gx=x+Math.cos(a)*3,gy=y+Math.sin(a)*3;
  // Gun length — sniper longer, berserker shorter
  const gLen=pers==='sniper'?8:pers==='berserker'?3:5;
  ctx.fillStyle='#aaa';
  for(let i=0;i<gLen;i++){ctx.fillRect(Math.round(gx+Math.cos(a)*i),Math.round(gy+Math.sin(a)*i),1,1);}
  // Bodyguard: small shield marker on off-hand side
  if(pers==='bodyguard'){
    const sa=a+Math.PI/2;
    ctx.fillStyle='#89b';ctx.globalAlpha=0.9;
    ctx.fillRect(Math.round(x+Math.cos(sa)*3),Math.round(y+Math.sin(sa)*3)-1,1,3);
    ctx.fillRect(Math.round(x+Math.cos(sa)*3)-1,Math.round(y+Math.sin(sa)*3),3,1);
    ctx.globalAlpha=1;
  }
  if(p.muzzle>0){const mx=gx+Math.cos(a)*5,my=gy+Math.sin(a)*5;ctx.fillStyle='#ffb';ctx.fillRect(Math.round(mx)-1,Math.round(my)-1,3,3);ctx.fillStyle='#fff';ctx.fillRect(Math.round(mx),Math.round(my),1,1);}
  // Charge aura
  if(p.chargeT>0.05){
    const pw=Math.min(1,p.chargeT/1.5);
    const rad=Math.round(3+pw*8);
    const cc=pw<0.4?'#ff8':pw<0.8?'#f80':'#f44';
    ctx.fillStyle=cc;ctx.globalAlpha=0.35+pw*0.55;
    ctx.fillRect(x-rad-1,y-1,2,2);ctx.fillRect(x+rad,y-1,2,2);
    ctx.fillRect(x-1,y-rad-1,2,2);ctx.fillRect(x-1,y+rad,2,2);
    if(rad>=5){const d=Math.round(rad*.7);
      ctx.fillRect(x-d-1,y-d-1,2,2);ctx.fillRect(x+d,y-d-1,2,2);
      ctx.fillRect(x-d-1,y+d,2,2);ctx.fillRect(x+d,y+d,2,2);}
    ctx.globalAlpha=1;
  }
  // Parry ring
  if(p.parryT>0){
    const pa=p.parryT/.18;
    ctx.globalAlpha=pa*.9;
    ctx.strokeStyle='#fff';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=pa*.25;
    ctx.fillStyle='#adf';
    ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  // Name tag (MP only)
  if(players.length>1)pixText(p.pal.name,x-4,y-12,p.pal.body);
}

function drawEnemy(e){
  const x=Math.round(e.x),y=Math.round(e.y);
  // ── Boss ────────────────────────────────────
  if(e.type==='boss'){
    const tier=e._tier||'green';
    const pulse=Math.abs(Math.sin(time*5));
    let _bc,_hc,_belt,_eye='#f00';
    if(tier==='green') {_bc='#622';_hc='#411';_belt='#833';}
    else if(tier==='yellow'){_bc='#886';_hc='#553';_belt='#aa8';_eye='#ff8';}
    else if(tier==='red')  {_bc='#c22';_hc='#811';_belt='#f44';_eye='#f66';}
    else                   {_bc='#528';_hc='#314';_belt='#83b';_eye='#f0f';}
    const bc=e.hit>0?'#fff':_bc,hc=e.hit>0?'#fff':_hc;
    // Shadow
    ctx.fillStyle='#000';ctx.globalAlpha=.45;ctx.fillRect(x-10,y+8,20,4);ctx.globalAlpha=1;
    // Fists
    ctx.fillStyle=bc;ctx.fillRect(x-13,y-4,5,5);ctx.fillRect(x+8,y-4,5,5);
    // Body
    ctx.fillStyle=bc;ctx.fillRect(x-6,y-6,12,14);
    // Belt stripe
    ctx.fillStyle=e.hit>0?'#fff':_belt;ctx.fillRect(x-6,y+1,12,2);
    // Head
    ctx.fillStyle=hc;ctx.fillRect(x-5,y-11,10,6);
    // Eyes glow
    ctx.fillStyle=_eye;ctx.globalAlpha=.6+pulse*.4;
    ctx.fillRect(x-4,y-9,3,2);ctx.fillRect(x+1,y-9,3,2);
    ctx.globalAlpha=1;
    // Legs animate
    const lb=((time*7)|0)%2;
    ctx.fillStyle=e.hit>0?'#fff':'#400';
    ctx.fillRect(x-5,y+8,4,4-lb);ctx.fillRect(x+1,y+8,4,3+lb);
    // Final boss: appendages + orbiting gem
    if(tier==='final'){
      ctx.fillStyle=bc;
      ctx.fillRect(x-15,y-2,6,4);ctx.fillRect(x+9,y-2,6,4); // arms
      ctx.fillRect(x-2,y-15,4,6);ctx.fillRect(x-2,y+9,4,6); // spikes
      const ox2=Math.round(Math.cos(time*2.5)*13),oy2=Math.round(Math.sin(time*2.5)*13);
      ctx.fillStyle='#f0f';ctx.globalAlpha=.5+pulse*.5;
      ctx.fillRect(x+ox2-1,y+oy2-1,3,3);ctx.globalAlpha=1;
    }
    // Holding GK indicator
    if(e._gkPhase==='holding'){
      ctx.fillStyle='#0cf';ctx.fillRect(x-2,y-22,5,8);
      ctx.fillStyle='#08a';ctx.fillRect(x-2,y-26,5,5);
      ctx.fillStyle='#fff';ctx.fillRect(x-1,y-25,1,1);ctx.fillRect(x+1,y-25,1,1);
    }
    // Name + HP bar
    const bLabel=tier==='final'?'FINAL':tier==='red'?'RED':tier==='yellow'?'GOLD':'BOSS';
    const bLabelCol=tier==='final'?'#f0f':tier==='red'?'#f44':tier==='yellow'?'#ff8':'#f44';
    ctx.globalAlpha=.9;pixText(bLabel,x-Math.floor(bLabel.length*2),y-18,bLabelCol);ctx.globalAlpha=1;
    const bpw=tier==='final'?36:28;ctx.fillStyle='#400';ctx.fillRect(x-(bpw>>1),y-21,bpw,2);
    ctx.fillStyle=e.hit>0?'#ff0':bLabelCol;ctx.fillRect(x-(bpw>>1),y-21,(bpw*e.hp/e._maxHp)|0,2);
    return;
  }
  ctx.fillStyle='#000';ctx.globalAlpha=.4;ctx.fillRect(x-e.r,y+e.r-1,e.r*2,2);ctx.globalAlpha=1;
  let body,head;
  if(e.type==='grunt')    {body='#494';head='#7a7';}
  else if(e.type==='runner')  {body='#963';head='#c85';}
  else if(e.type==='brute')   {body='#722';head='#a44';}
  else if(e.type==='shooter') {body='#549';head='#86c';}
  else if(e.type==='poison')  {body='#362';head='#594';}
  else if(e.type==='zombie')  {body=e.pal.body;head='#9a8';}
  else if(e.type==='splatter'){body='#639';head='#96c';}
  else if(e.type==='dasher')  {body=e.dashing?'#f60':'#a50';head=e.dashing?'#ff4':'#c80';}
  else if(e.type==='ghost')   {body='#8af';head='#adf';}
  else if(e.type==='bomber')  {body='#622';head='#944';}
  if(e.type==='ghost')ctx.globalAlpha=0.5+Math.sin(time*4+e.x*.05)*0.18;
  if(e.hit>0){body='#fff';head='#fff';}
  if(e.type==='brute'){ctx.fillStyle=body;ctx.fillRect(x-4,y-4,8,7);ctx.fillStyle=head;ctx.fillRect(x-3,y-6,6,3);ctx.fillStyle='#f00';ctx.fillRect(x-2,y-5,1,1);ctx.fillRect(x+1,y-5,1,1);}
  else if(e.type==='shooter'){
    ctx.fillStyle=body;ctx.fillRect(x-2,y-3,4,6);ctx.fillStyle=head;ctx.fillRect(x-2,y-5,4,3);
    ctx.fillStyle='#ff0';ctx.fillRect(x-1,y-4,1,1);ctx.fillRect(x,y-4,1,1);
    ctx.fillStyle='#aaa';for(let i=0;i<3;i++)ctx.fillRect(Math.round(x+Math.cos(e.ang)*(3+i)),Math.round(y+Math.sin(e.ang)*(3+i)),1,1);
  } else if(e.type==='zombie'){
    ctx.fillStyle=body;ctx.fillRect(x-2,y-3,4,6);
    ctx.fillStyle=e.pal.dark;ctx.fillRect(x-2,y+2,1,1);ctx.fillRect(x+1,y+1,1,2);
    ctx.fillStyle=head;ctx.fillRect(x-2,y-5,4,3);
    ctx.fillStyle='#f00';ctx.fillRect(x-1,y-4,1,1);ctx.fillRect(x,y-4,1,1);
    if(((time*4+e.x)|0)%3===0){ctx.fillStyle='#800';ctx.fillRect(x-1,y-2,1,1);}
    ctx.fillStyle=e.pal.dark;ctx.fillRect(x-2,y+3,1,2);ctx.fillRect(x+1,y+3,1,2);
    ctx.fillStyle='#666';for(let i=0;i<4;i++)ctx.fillRect(Math.round(x+Math.cos(e.ang)*(3+i)),Math.round(y+Math.sin(e.ang)*(3+i)),1,1);
    ctx.globalAlpha=.7;pixText(e.fromName,x-4,y-13,'#a44');ctx.globalAlpha=1;
  } else if(e.type==='runner'){
    // Tall thin sprinter — small head high, lean body, fast pumping legs
    ctx.fillStyle=head;ctx.fillRect(x-1,y-7,2,2);           // tiny head up high
    ctx.fillStyle=body;ctx.fillRect(x-1,y-5,2,6);           // thin body
    ctx.fillStyle='#f80';ctx.fillRect(x-1,y-6,1,1);         // eye
    const rl=((e.anim*18)|0)%2;
    ctx.fillStyle=body;ctx.fillRect(x-2,y+1,1,2+rl);ctx.fillRect(x+1,y+1,1,3-rl); // fast legs
    ctx.fillStyle=body;ctx.fillRect(x-3,y-3,1,2);ctx.fillRect(x+2,y-4,1,2);        // swinging arms
  } else if(e.type==='ghost'){
    // Teardrop / floating blob — bobs up and down, semi-transparent (alpha set above)
    const bob=Math.round(Math.sin(time*2.8+e.x*.07));
    ctx.fillStyle=body;
    ctx.fillRect(x-1,y-9+bob,2,3);   // narrow top
    ctx.fillRect(x-2,y-7+bob,4,3);   // upper dome
    ctx.fillRect(x-3,y-4+bob,6,5);   // wide mid blob
    ctx.fillRect(x-2,y+1+bob,2,2);ctx.fillRect(x,y+1+bob,2,2); // bottom frills
    ctx.fillStyle=e.hit>0?'#f00':head;ctx.fillRect(x-2,y-3+bob,1,1);ctx.fillRect(x,y-3+bob,1,1); // eyes
  } else if(e.type==='bomber'){
    // Fat barrel body with fuse on top
    ctx.fillStyle='#fa8';ctx.fillRect(x,y-10,1,2);           // fuse spark
    ctx.fillStyle='#aaa';ctx.fillRect(x,y-8,1,3);            // fuse wire
    ctx.fillStyle=head;ctx.fillRect(x-2,y-5,3,2);            // small head
    ctx.fillStyle=body;ctx.fillRect(x-3,y-3,6,7);            // fat barrel
    ctx.fillStyle='#844';ctx.fillRect(x-3,y,6,1);            // band stripe
    // X mark danger
    if(e.hit===0){
      ctx.fillStyle='#f22';
      ctx.fillRect(x-2,y-2,1,1);ctx.fillRect(x+1,y-2,1,1);
      ctx.fillRect(x-1,y-1,1,1);ctx.fillRect(x,y-1,1,1);
      ctx.fillRect(x-2,y+2,1,1);ctx.fillRect(x+1,y+2,1,1);
    }
  } else if(e.type==='splatter'){
    // Wide amorphous blob with animated drips
    const dr=((e.anim*4)|0)%3;
    ctx.fillStyle=body;
    ctx.fillRect(x-3,y-4,6,4);       // upper blob
    ctx.fillRect(x-4,y,8,4);         // wide lower mass
    ctx.fillRect(x-2,y-5,4,2);       // bumpy top
    ctx.fillStyle=e.hit>0?'#fff':head;
    ctx.fillRect(x-2,y-3,1,1);ctx.fillRect(x,y-3,1,1); // eyes
    ctx.fillStyle=body;
    ctx.fillRect(x-3,y+4,1,1+dr);ctx.fillRect(x-1,y+4,1,1+((dr+1)%3));ctx.fillRect(x+1,y+4,1,1+((dr+2)%3)); // drips
  } else if(e.type==='dasher'){
    // Low crouching predator — head pushed forward
    ctx.fillStyle=head;ctx.fillRect(x+2,y-3,3,2);            // head forward-right
    ctx.fillStyle=body;ctx.fillRect(x-3,y-1,7,3);            // wide flat body
    ctx.fillStyle=e.hit>0?'#fff':'#ff4';ctx.fillRect(x+3,y-3,1,1); // forward eye
    if(e.dashing){
      ctx.fillStyle=body;ctx.globalAlpha=.45;
      ctx.fillRect(x-6,y,3,2);ctx.fillRect(x-5,y+1,2,1);    // motion trail
      ctx.globalAlpha=1;
    } else {
      const dl=((e.anim*10)|0)%2;
      ctx.fillStyle=body;ctx.fillRect(x-3,y+2,2,1+dl);ctx.fillRect(x,y+2,2,2-dl); // crouched legs
    }
  } else if(e.type==='poison'){
    // Mushroom — wide spotted cap + thin stem
    ctx.fillStyle=head;
    ctx.fillRect(x-2,y-7,4,2);       // cap top-dome
    ctx.fillRect(x-3,y-5,6,3);       // wide cap brim
    ctx.fillStyle=e.hit>0?'#fff':'#2a5'; // spots
    ctx.fillRect(x-2,y-6,1,1);ctx.fillRect(x,y-5,1,1);ctx.fillRect(x+1,y-6,1,1);
    ctx.fillStyle='#9c9';ctx.fillRect(x-3,y-2,6,1); // cap underside
    ctx.fillStyle=body;ctx.fillRect(x-1,y-1,2,4);   // thin stem
  } else {
    // GRUNT default
    ctx.fillStyle=body;ctx.fillRect(x-2,y-2,4,5);ctx.fillStyle=head;ctx.fillRect(x-2,y-4,4,3);
    ctx.fillStyle='#f00';ctx.fillRect(x-1,y-3,1,1);ctx.fillRect(x,y-3,1,1);
    const reach=Math.sin(e.anim*8);ctx.fillStyle=body;ctx.fillRect(x-3,y-1+reach,1,2);ctx.fillRect(x+2,y-1-reach,1,2);
  }
  ctx.globalAlpha=1; // reset ghost alpha
  // Bomber countdown
  if(e.type==='bomber'&&e.fuseT!==undefined){
    const cnt=''+Math.ceil(e.fuseT);
    const fast=e.fuseT<2;
    ctx.globalAlpha=fast?0.7+Math.sin(performance.now()/120)*0.3:0.9;
    pixText(cnt,x-Math.floor(cnt.length*2),y-12,fast?'#f44':'#fa8');
    ctx.globalAlpha=1;
  }
}

// ── HUD ──────────────────────────────────────
function drawHUD(){
  // Depth progress bar (top)
  ctx.fillStyle='#111';ctx.fillRect(0,0,W,4);
  ctx.fillStyle=stage===MAX_DEPTH?'#ff0':'#0af';
  ctx.fillRect(0,0,(W*stage/MAX_DEPTH)|0,4);
  ctx.fillStyle='#0ff';ctx.fillRect((W*stage/MAX_DEPTH)|0,1,1,2);
  // Monster house banner
  if(monsterHouse&&!monsterHouseCleared){
    const rem=enemies.length;
    const pulse=Math.abs(Math.sin(time*4))*.3;
    ctx.fillStyle='#f00';ctx.globalAlpha=0.12+pulse;ctx.fillRect(0,4,W,10);ctx.globalAlpha=1;
    const mhStr='!! MONSTER HOUSE !!  REMAIN: '+rem;
    pixText(mhStr,(W-mhStr.length*4)>>1,6,'#f44');
  }
  // Boss HP bar (when boss alive)
  const _boss=running?enemies.find(e=>e.type==='boss'):null;
  if(_boss){
    const bw=100;const bx2=(W-bw)>>1;
    ctx.fillStyle='#300';ctx.fillRect(bx2,5,bw,4);
    ctx.fillStyle=_boss.hit>0?'#ff0':'#f44';ctx.fillRect(bx2,5,(bw*_boss.hp/_boss._maxHp)|0,4);
    pixText('★BOSS',bx2-22,5,'#f44');
    const pct=Math.round(100*_boss.hp/_boss._maxHp);
    pixText(pct+'%',bx2+bw+2,5,'#f88');
  }

  // Bottom bar
  ctx.fillStyle='#000c';ctx.fillRect(0,H-22,W,22);

  const n=Math.max(4,players.length),sw=Math.floor(W/n);
  for(let i=0;i<players.length;i++){
    const p=players[i],sx=i*sw+2;
    const nc=p.alive?p.pal.body:'#555';
    // Row 1: name + personality label side by side
    const persLabel=p.isHuman?'':( p.controller._rouletteDisplay || PERS_LABEL[p.controller.personality] || '');
    pixText(p.pal.name,sx,H-22+2,nc);
    if(persLabel)pixText(persLabel,sx+p.pal.name.length*4+2,H-22+2,p.alive?p.pal.body:'#555');
    if(!p.alive){pixText('ZOMBIE',sx,H-22+10,'#f44');continue;}
    // HP bar
    const hw=sw-6;ctx.fillStyle='#400';ctx.fillRect(sx,H-22+8,hw,3);
    ctx.fillStyle=p.hp<p.maxHp*.3?'#f44':'#4c4';ctx.fillRect(sx,H-22+8,(hw*p.hp/p.maxHp)|0,3);
    // Row 2: LV + ability badge
    pixText('LV'+p.level,sx,H-22+13,'#cfc');
    if(!p.isHuman&&!p.controller._rouletteDisplay){
      const abilBadge=p.controller.ability;
      pixText(abilBadge,sx+('LV'+p.level).length*4+2,H-22+13,'#ff0');
    }
    // Dash cd dot
    ctx.fillStyle=p.dashCd<=0?'#0ff':'#334';ctx.fillRect(sx+sw-8,H-22+2,2,2);
    // Revive star
    if(p.hasRevive){ctx.fillStyle='#ff0';ctx.fillRect(sx+sw-8,H-22+6,2,2);pixText('★',sx+sw-14,H-22+5,'#ff0');}
    if(p.isHuman){
      let bx=sx;
      if(driverActive){pixText('DRV',bx,H-22+6,'#ffd700');bx+=16;}
      if(overdriveActive){pixText('OVD',bx,H-22+6,'#f80');bx+=16;}
      if(vertidriveActive){pixText('VTD',bx,H-22+6,'#f0f');bx+=16;}
      if(callCooldown>0){pixText('CALL:'+Math.ceil(callCooldown)+'s',bx,H-22+6,'#446');}
    }
  }

  // Stage / cores (top-right, below progress bar)
  const stageStr=stage+'/'+MAX_DEPTH,coreStr=coresCollected+'/'+coresNeeded;
  pixText('D'+stageStr,W-4-(stageStr.length+1)*4,6,'#0ff');
  pixText(exitOpen?'EXIT!':coreStr,W-4-coreStr.length*4,14,exitOpen?'#ff0':'#8cf');

  // Messages
  const maxMsg=Math.min(messages.length,5);
  for(let i=0;i<maxMsg;i++){
    const m=messages[i],a=m.t<1.5?1:Math.max(0,(2.2-m.t)/.7);
    ctx.globalAlpha=a;
    pixText(m.msg,(W-m.msg.length*4)>>1,20+i*7,m.c);
  }
  ctx.globalAlpha=1;

  if(exitOpen&&stage!==MAX_DEPTH)pixText('REACH EXIT >>',W/2-(13*4)/2,H-28,'#ff0');
  if(stage===MAX_DEPTH&&exitOpen)pixText('FIND THE SCREW!',W/2-(15*4)/2,H-28,'#ff0');

  // Controls hint (first 7 seconds of a floor)
  if(time<7){
    const fa=time<5?1:Math.max(0,(7-time)/2);
    ctx.globalAlpha=fa*.7;
    const hints=['WASD=MOVE  CLICK=FIRE  SPACE=DASH  Q=PARRY','TAB=CALL CPU  HOW TO PLAY: LOBBY'];
    hints.forEach((h,i)=>pixText(h,(W-h.length*4)>>1,H-45+i*8,'#89a'));
    ctx.globalAlpha=1;
  }

  // ── Debug overlay ─────────────────────────
  if(!debug||!running)return;
  const dl=[
    '[DEBUG MODE]  F1:off',
    'STAGE: '+stage+'/'+MAX_DEPTH+(stage===MAX_DEPTH?' ← FINAL':''),
    'ENEMIES: '+enemies.length,
    'CORES: '+coresCollected+'/'+coresNeeded+(exitOpen?' OPEN':''),
    'SCREW: '+(screwObj?'x'+((screwObj.x/TILE)|0)+' y'+((screwObj.y/TILE)|0):'none (not D100)'),
    'EXIT:  x'+((exits[0]?exits[0].x/TILE|0:'?'))+' y'+((exits[0]?exits[0].y/TILE|0:'?')),
    'P1:    x'+((players[0]?players[0].x/TILE|0:'?'))+' y'+((players[0]?players[0].y/TILE|0:'?')),
    '─────────────────',
    '] NEXT FLOOR',
    '[ JUMP TO D100',
    '\\ REVEAL ALL',
    '= GIVE ALL CORES',
    '; KILL ENEMIES',
    'M GOD MODE',
    'B SPAWN BOSS',
    'C CYCLE COFFEE BREAK',
    'E ENDING PREVIEW',
    'R RESET RECORD',
    monkeyMode?'K AUTO PLAY [ON]':'K AUTO PLAY',
  ];
  const pw=dl.reduce((m,s)=>Math.max(m,s.length),0)*4+6;
  const ph=dl.length*7+6;
  ctx.globalAlpha=0.82;ctx.fillStyle='#000';ctx.fillRect(2,22,pw,ph);
  ctx.globalAlpha=1;ctx.fillStyle='#111';ctx.fillRect(2,22,pw,1);
  for(let i=0;i<dl.length;i++){
    const c=dl[i].startsWith('[')?'#f80':dl[i].startsWith('─')?'#333':'#8fc';
    pixText(dl[i],5,25+i*7,c);
  }
}

  '0':'111;101;101;101;111','1':'010;110;010;010;111','2':'111;001;111;100;111',
  '3':'111;001;111;001;111','4':'101;101;111;001;001','5':'111;100;111;001;111',
  '6':'111;100;111;101;111','7':'111;001;010;010;010','8':'111;101;111;101;111',
  '9':'111;101;111;001;111','A':'010;101;111;101;101','B':'110;101;110;101;110',
  'C':'111;100;100;100;111','D':'110;101;101;101;110','E':'111;100;110;100;111',
  'F':'111;100;110;100;100','G':'111;100;101;101;111','H':'101;101;111;101;101',
  'I':'111;010;010;010;111','J':'001;001;001;101;111','K':'101;110;100;110;101',
  'L':'100;100;100;100;111','M':'101;111;111;101;101','N':'101;111;111;111;101',
  'O':'111;101;101;101;111','P':'111;101;111;100;100','Q':'111;101;101;111;011',
  'R':'110;101;110;101;101','S':'111;100;111;001;111','T':'111;010;010;010;010',
  'U':'101;101;101;101;111','V':'101;101;101;101;010','W':'101;101;111;111;101',
  'X':'101;101;010;101;101','Y':'101;101;010;010;010','Z':'111;001;010;100;111',
  ' ':'000;000;000;000;000','/':'001;001;010;100;100','!':'010;010;010;000;010',
  '+':'000;010;111;010;000','-':'000;000;111;000;000','.':'000;000;000;000;010',
  ':':'000;010;000;010;000','>':'100;010;001;010;100','?':'111;001;010;000;010',
};
function pixText(str,x,y,c='#fff'){
  ctx.fillStyle=c;str=(''+str).toUpperCase();
  for(let i=0;i<str.length;i++){
    const ch=FONT[str[i]]||FONT[' '],rows=ch.split(';');
    for(let r=0;r<5;r++)for(let cc=0;cc<3;cc++)if(rows[r][cc]==='1')ctx.fillRect(x+i*4+cc,y+r,1,1);
  }
}


// ═══════════════════════════════════════════════
//  SAVE / LOAD  (localStorage)
// ═══════════════════════════════════════════════
const SAVE_KEY='lores-hack-v1';

function hasSave(){return!!localStorage.getItem(SAVE_KEY);}

function getSaveLabel(){
  try{
    const d=JSON.parse(localStorage.getItem(SAVE_KEY));
    const hp=d.players.find(p=>p.isHuman);
    return'↩ DEPTH '+d.stage+' / LV'+( hp?hp.level:1)+' / KILLS '+d.totalKills;
  }catch(e){return'';}
}

function saveGame(){
  const data={
    v:1,stage,totalKills,
    cfg:{cpus:cfg.cpus,slots:[...cfg.slots]},
    players:players.map(p=>({
      idx:p.idx,hp:p.hp,maxHp:p.maxHp,
      level:p.level,xp:p.xp,
      weapon:{...p.weapon},
      isHuman:p.isHuman,alive:p.alive,hasRevive:p.hasRevive,
      ctrlType:p.isHuman?(cfg.slots[0]||'KB+M'):'CPU',
      personality:p.isHuman?null:p.controller.personality,
      accXp:p.accXp,kills:p.kills
    }))
  };
  localStorage.setItem(SAVE_KEY,JSON.stringify(data));
}

function clearSave(){localStorage.removeItem(SAVE_KEY);}

function loadGame(){
  const raw=localStorage.getItem(SAVE_KEY);
  if(!raw)return false;
  let data;
  try{data=JSON.parse(raw);}catch(e){clearSave();return false;}
  if(data.v!==1){clearSave();return false;}
  clearSave(); // Roguelike rule: resume is one-shot — no going back on death

  // Restore cfg
  cfg.cpus=data.cfg.cpus;cfg.slots=data.cfg.slots;
  renderLobby();

  // Rebuild players from saved snapshot
  players=[];
  for(const pd of data.players){
    const ctrl=pd.isHuman
      ?(pd.ctrlType==='GAMEPAD'?new PadController():new KMController())
      :new CPUController(pd.personality);
    const p=makePlayer(pd.idx,ctrl,pd.isHuman);
    p.hp=pd.hp;p.maxHp=pd.maxHp;
    p.level=pd.level;p.xp=pd.xp;
    p.hasRevive=pd.hasRevive||false;
    p.weapon={...pd.weapon};
    p.alive=pd.alive;p.accXp=pd.accXp;p.kills=pd.kills;
    players.push(p);
  }

  stage=data.stage;totalKills=data.totalKills;gameWon=false;
  monsterHouse=false;monsterHouseCleared=false;mhSpawnPending=0;
  bullets=[];ebullets=[];enemies=[];particles=[];pickups=[];messages=[];
  bulletTime=null;
  running=true;PSG.play(stage);
  cv.classList.toggle('cur',!players.some(p=>p.isHuman&&p.controller.type==='KB+M'));
  genMap();spawnT=.5;
  let cx=0,cy=0,n=0;for(const p of players){if(!p.alive)continue;cx+=p.x;cy+=p.y;n++;}
  if(n){camX=cx/n;camY=cy/n;}
  // Restore zombies for dead CPU players
  for(const p of players){
    if(!p.alive&&!p.isHuman){
      const zm=makeZombie(p);
      // Spawn near map center, away from living players
      for(let t=0;t<200;t++){
        const tx=rndi(3,MAPW-3),ty=rndi(3,MAPH-3);

function _audioToWav(buffer){
  const nCh=buffer.numberOfChannels,sr=buffer.sampleRate,ns=buffer.length;
  const ab=new ArrayBuffer(44+ns*nCh*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+ns*nCh*2,true);ws(8,'WAVE');
  ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
  v.setUint16(22,nCh,true);v.setUint32(24,sr,true);
  v.setUint32(28,sr*nCh*2,true);v.setUint16(32,nCh*2,true);v.setUint16(34,16,true);
  ws(36,'data');v.setUint32(40,ns*nCh*2,true);
  let off=44;
  for(let i=0;i<ns;i++)for(let c=0;c<nCh;c++){
    const s=Math.max(-1,Math.min(1,buffer.getChannelData(c)[i]));
    v.setInt16(off,s*0x7FFF,true);off+=2;
  }
  return ab;
}

//  PSG MUSIC ENGINE  (Web Audio API / AY-3-8910 style)
// ═══════════════════════════════════════════════
const PSG=(()=>{
  let AC,mGain,dNode,dGain,seqId,nextT,step,pat,bpm;
  const CLK=1750000; // AY-3-8910 master clock

  // Deterministic LCG seeded per stage
  function rng(seed){
    let s=(seed*1664525+1013904223)>>>0;
    return()=>{s=(s*1664525+1013904223)>>>0;return s/0x100000000;};
  }

  // Quantize to real PSG frequency steps (removes "clean" digital sound)
  function pf(hz){const n=Math.max(1,Math.round(CLK/(16*hz)));return CLK/(16*n);}
  function midi(n){return pf(440*Math.pow(2,(n-69)/12));}

  // Depth zones — scale, root MIDI, base BPM
  // D01-20: major               → bright adventure start
  // D21-40: lydian              → soaring, uplifting (#4 gives floating feel)
  // D41-60: mixolydian          → driving heroic energy (b7 adds punch)
  // D61-80: dorian              → dark hero — tense but still fighting
  // D81-100: major high BPM    → triumphant climax, earned glory
  const ZONES=[
    {sc:[0,2,4,5,7,9,11],root:48,bpmBase:90},
    {sc:[0,2,4,6,7,9,11],root:50,bpmBase:108},
    {sc:[0,2,4,5,7,9,10],root:48,bpmBase:126},
    {sc:[0,2,3,5,7,9,10],root:46,bpmBase:148},
    {sc:[0,2,4,5,7,9,11],root:52,bpmBase:162},
  ];
  function zone(st){return ZONES[Math.min(4,Math.floor((st-1)/20))];}

  // Generate 8 or 16-step pattern seeded from stage
  // Boss pattern — aggressive, 16-step, diminished-dominant flavour
  function genBossPat(st){
    const r=rng(st*3571+99991);
    // Double harmonic / diminished feel: root, b2, 3, b5, 5, b7
    const sc=[0,1,4,6,7,10];
    // Root drops deeper with each boss floor
    const rt=36+((st/10)|0)%4*(-2);
    const mel=[],bass=[],arp=[];
    for(let i=0;i<16;i++){
      // Punchy melody: mostly on-beat, occasional rests
      mel.push(r()<0.18?null:rt+sc[Math.floor(r()*sc.length)]+(r()<0.35?12:0)+24);
      // Driving bass on every beat (every 4 8th-steps), occasional 5th
      bass.push(i%4===0?rt+12:i%4===2?rt+7+12:null);
      // Fast frantic arpeggio always on (16th-note feel)
      arp.push(rt+sc[i%sc.length]+(i%3===0?24:12));

  }

  function genPat(st){
    const r=rng(st*7919+31337);
    const z=zone(st);

    const deep=st>=61;

    const mel=[],bass=[],arp=[];
    for(let i=0;i<len;i++){
      // Melody: ~25% rest, otherwise random scale degree, occasional +1 octave
      mel.push(r()<0.30?null:rt+sc[Math.floor(r()*sc.length)]+(r()<0.40?12:0)+24);
      // Bass: root on beat1, 5th on beat3
      const fifth=sc[sc.length>4?4:sc.length-1];
      bass.push(i%len===0?rt+12:i%4===2?rt+fifth+12:null);
      // Arpeggio texture only D61+ (frantic upper channel)
      arp.push(deep?rt+sc[i%sc.length]+(i%2?12:24):null);

  function init(){
    if(AC)return;
    AC=new(window.AudioContext||window.webkitAudioContext)();
    mGain=AC.createGain();mGain.gain.value=0.20;
