        }
      };
      if(AC.state==='suspended'){AC.resume().then(()=>{if(seqId)return;nextT=AC.currentTime+.08;seqId=setInterval(play,22);});}
      else{if(!seqId){nextT=AC.currentTime+.08;seqId=setInterval(play,22);}}
    },
    // Monster House BGM — D minor, 190 BPM, panic / chase feel
    mhouse(st){
      this.stop();init();
      const bpmM=190+(st||1)*.05;
      // D minor: D=38/50/62, F=41/53/65, G=43/55/67, A=45/57/69, Bb=46/58/70, C=48/60/72
      const mel =[74,null,72,69, 70,67,null,65, 67,69,70,null, 72,74,null,72];
      const bass=[38,null,38,null, 45,null,43,null, 38,null,38,null, 41,null,40,null];
      const arp =[62,65,69,72, 69,65,62,60, 62,65,70,72, 70,65,62,60];
      let mhStep=0;
      const sd=60/bpmM/2;
      const play=()=>{
        while(nextT<AC.currentTime+.18){
          const i=mhStep%16;
          if(mel[i] !==null)noteOn(midi(mel[i]), 'square',  .18,nextT,sd*.65);
          if(bass[i]!==null)noteOn(midi(bass[i]),'triangle',.25,nextT,sd*1.3);
          if(arp[i] !==null)noteOn(midi(arp[i]), 'square',  .07,nextT,sd*.28);
          if(i%4===0)noiseOn(140,.09,nextT,.05);   // kick every beat
          if(i%8===4)noiseOn(1400,.06,nextT,.022); // snare
          if(i%2===1)noiseOn(800,.02,nextT,.015);  // hihat
          mhStep++;nextT+=sd;
        }
      };
      if(AC.state==='suspended'){AC.resume().then(()=>{if(seqId)return;nextT=AC.currentTime+.08;seqId=setInterval(play,22);});}
      else{if(!seqId){nextT=AC.currentTime+.08;seqId=setInterval(play,22);}}
    }
  };
})();

function startGame(){
  // Build players
  players=[];
  const total=1+cfg.cpus; // always 1 human + N CPU
  for(let i=0;i<total;i++){
    let ctrl,isHuman=i===0;
    if(isHuman){
      const slot=cfg.slots[0]||'KB+M';
      ctrl=slot==='GAMEPAD'?new PadController():new KMController();
    }else ctrl=new CPUController(['bodyguard','sniper','berserker'][i-1]);
    players.push(makePlayer(i,ctrl,isHuman));
  }
  // Roulette animation for Moody CPUs, instant reveal for others
  for(const p of players){
    if(p.isHuman)continue;
    if(p.controller.personality==='moody'){
      p.controller._rouletteDisplay='????';
      const labels=PERS_LIST.filter(x=>x!=='moody').map(x=>PERS_LABEL[x]);
      let tick=0,delay=60;
      const totalTicks=18+Math.floor(Math.random()*8);
      (function spin(){
        p.controller._rouletteDisplay=labels[tick%labels.length];
        tick++;
        if(tick<totalTicks){
          delay=Math.min(260,delay*1.18|0);
          setTimeout(spin,delay);
        }else{
          p.controller._rouletteDisplay=null;
          flash(p.pal.name+': MOODY→'+p.controller.ability,p.pal.body);
        }
      })();
    }else{
      flash(p.pal.name+': '+PERS_LABEL[p.controller.personality],p.pal.body);
    }
  }

  stage=1;totalKills=0;gameWon=false;gameOverState=false;_hasDashParried=false;
  monsterHouse=false;monsterHouseCleared=false;mhSpawnPending=0;
  bullets=[];ebullets=[];enemies=[];particles=[];pickups=[];messages=[];gatekeepers=[];poisonPuddles=[];npcs=[];
  bulletTime=null;driverActive=false;overdriveActive=false;vertidriveActive=true;laserActive=false;
  paused=false;
  running=true;PSG.play(1);
  cv.classList.toggle('cur',!players.some(p=>p.isHuman&&p.controller.type==='KB+M'));
  genMap();spawnT=.5;
  let cx=0,cy=0,n=0;for(const p of players){cx+=p.x;cy+=p.y;n++;}camX=cx/n;camY=cy/n;
  lobbyEl.style.display='none';
}

let coffeeBreak=null,_hasDashParried=false;

// ── Helpers ──────────────────────────────────
const _GY=105; // sprite center y (ground at _GY+8)

function _cbP(sx,sy,aim,pal,extra){
  const hp=players.find(p=>p.isHuman);
  return Object.assign({x:sx,y:sy,aim:aim??0,alive:true,
    pal:pal??P_PAL[0],muzzle:0,dashT:0,iframe:0,chargeT:0,parryT:0,
    level:hp?.level??1,hp:100,maxHp:100,r:3,vx:0,vy:0,idx:0,
    shields:[],shieldAngle:0},extra??{});
}
function _cbE(type,sx,sy,ang,extra){
  const e=makeEnemy(type,sx,sy);
  return Object.assign(e,{ang:ang??0,anim:coffeeBreak.t*3,hit:0,_dead:false},extra??{});
}
function _cbBubble(text,x,y,col){
  const w=text.length*4+4;
  ctx.fillStyle='#111';ctx.fillRect(x-1,y-1,w+2,9);
  pixText(text,x+2,y+1,col??'#fff');
}
function _cbSparks(cx,cy,age,dur,n,col1,col2,spd){
  if(age<0||age>dur)return;
  const r=age*spd,a=Math.max(0,1-age/dur);
  for(let i=0;i<n;i++){const ang=i*Math.PI*2/n;
    ctx.globalAlpha=a;ctx.fillStyle=i%2?col1:col2;
    ctx.fillRect((cx+Math.cos(ang)*r)|0,(cy+Math.sin(ang)*r)|0,2,2);}
  ctx.globalAlpha=1;
}
// Temporarily swap time → coffeeBreak.t so sprite animations play correctly
function _cbF(fn){const sv=time;time=coffeeBreak.t;fn();time=sv;ctx.globalAlpha=1;}

// ── Skit A: CHASE ────────────────────────────
// Grunt chases player → player turns and shoots → grunt splats
function _cbChase(t){
  const gy=_GY;
  const pPal=players.find(p=>p.isHuman)?.pal??P_PAL[0];
  const px=t<2.5?70+t*50:195;
  _cbF(()=>drawPlayer(_cbP(px,gy,t<2.5?0:Math.PI,pPal,
    {muzzle:t>=3&&t<3.4?.15:0,vx:t<2.5?20:0})));
  if(t<4){
    const gx=t<2.5?20+t*62:175;
    _cbF(()=>drawEnemy(_cbE('grunt',gx,gy,t<2.5?0:Math.PI,
      {hit:t>=3&&t<3.5?.12:0,vx:t<2.5?15:0})));
  }
  // Bullet zipping left
  if(t>=3&&t<3.5){ctx.fillStyle='#ffe';ctx.fillRect((195-(t-3)*520)|0,gy-1,3,1);}
  // Splat sparks
  _cbSparks(175,gy,t-3.5,0.7,8,'#f44','#f80',60);
  if(t<2.5)_cbBubble('!!',38,gy-24,'#f44');
  if(t>=3.6&&t<5.5)_cbBubble('GOT HIM',148,gy-24,'#ff0');
}

// ── Skit B: VICTORY ──────────────────────────
// Player + surviving allies walk to center and celebrate
function _cbVictory(t){
  const gy=_GY,cx=W/2;
  const pPal=players.find(p=>p.isHuman)?.pal??P_PAL[0];
  const allies=players.filter(p=>!p.isHuman&&p.alive).slice(0,2);
  const px=t<2?50+t*50:150;
  _cbF(()=>drawPlayer(_cbP(px,gy,t<2?0:-Math.PI/2,pPal,{vx:t<2?20:0})));
  allies.forEach((al,i)=>{
    const ax=t<2?(W-70+i*20)-t*50:cx+(i+1)*18;
    _cbF(()=>drawPlayer(_cbP(ax,gy,t<2?Math.PI:-Math.PI/2,al.pal,{idx:al.idx,vx:t<2?-20:0})));
  });
  // Sparkle ring
  if(t>=2.2)for(let i=0;i<7;i++){
    const a=i*Math.PI*2/7+(t*1.8),r=22+Math.sin(t*5+i)*6;
    ctx.globalAlpha=0.7+Math.sin(t*6+i)*.3;
    ctx.fillStyle=['#ff0','#0ff','#f0f','#f80','#0f8','#adf','#fa8'][i];
    ctx.fillRect((cx+Math.cos(a)*r)|0,(gy-5+Math.sin(a)*r)|0,2,2);
  }
  ctx.globalAlpha=1;
  if(t>=2.5)_cbBubble(allies.length?'WELL DONE!':'SOLO CLEAR',cx-20,gy-30,'#ff0');
}

// ── Skit C: BOMBER ───────────────────────────
// Bomber walks in, notices player, panics and runs off, explodes
function _cbBomber(t){
  const gy=_GY;
  const pPal=players.find(p=>p.isHuman)?.pal??P_PAL[0];
  const px=t<3?75:75-(t-3)*60;
  _cbF(()=>drawPlayer(_cbP(px,gy,0,pPal,{vx:t>3&&t<3.5?-20:0})));

  const bang=t<2.5?Math.PI:0;
  if(t<3.2)_cbF(()=>drawEnemy(_cbE('bomber',bx,gy,bang,
    {fuseT:t<2?4:Math.max(.1,2-(t-2)*2),vx:t<1.5?-20:t>=2.5?30:0})));
  if(t>=3.2){
    if(t<3.7){ctx.fillStyle='#fff';ctx.globalAlpha=Math.max(0,1-(t-3.2)/0.5);ctx.fillRect(0,0,W,H);}
    ctx.globalAlpha=1;
    _cbSparks(W-28,gy,t-3.2,1.0,16,'#f80','#f44',80);
    _cbSparks(W-28,gy,Math.max(0,t-3.6),0.8,8,'#fff','#fe8',45);
  }
  if(t>=1.5&&t<2.3)_cbBubble('!!',bx-10,gy-24,'#f44');
  if(t>=3.8&&t<5.5)_cbBubble('PHEW...',50,gy-24,'#0f8');
}

// ── Skit D: GHOST ────────────────────────────
// Ghost floats in, player parries, ghost banished
function _cbGhost(t){
  const gy=_GY;
  const pPal=players.find(p=>p.isHuman)?.pal??P_PAL[0];
  _cbF(()=>drawPlayer(_cbP(230,gy,Math.PI,pPal,{parryT:t>=2.5&&t<3.2?.18:0})));
  const gx=t<2.5?40+t*72:220;
  const alpha=t<2.5?1:Math.max(0,1-(t-2.5)/.7);
  if(alpha>0.02){ctx.globalAlpha=alpha;_cbF(()=>drawEnemy(_cbE('ghost',gx,gy,0)));ctx.globalAlpha=1;}
  if(t>=2.5&&t<3){ctx.fillStyle='#adf';ctx.globalAlpha=Math.max(0,(1-(t-2.5)/.5))*.55;ctx.fillRect(0,0,W,H);}
  ctx.globalAlpha=1;
  _cbSparks(gx,gy-4,t-2.5,0.8,10,'#adf','#fff',65);
  if(t<2.3)_cbBubble('...',190,gy-24,'#888');
  if(t>=3.2)_cbBubble('BANISHED!',180,gy-24,'#adf');
}

// ── Skit E: BRUTE ────────────────────────────
// Brute charges, player dodges, brute hits left wall
function _cbBrute(t){
  const gy=_GY;
  const pPal=players.find(p=>p.isHuman)?.pal??P_PAL[0];
  const bx=t<2?W-60-t*110:t<2.8?(W-280)+(t-2)*30:W-280+24;
  _cbF(()=>drawEnemy(_cbE('brute',bx,gy,Math.PI,
    {hit:t>=2&&t<3?.15:0,vx:t<2?-30:t<2.8?15:0})));
  const px=t<1.5?W/2-t*60:t<2.5?W/2-90:t<3?W/2-90+(t-2.5)*160:W/2-10;
  _cbF(()=>drawPlayer(_cbP(px,gy,t<2.5?Math.PI:0,pPal,{vx:t<1.5?-25:t>=2.5&&t<3?35:0})));
  _cbSparks(38,gy,t-2,0.8,8,'#c84','#f80',55);
  if(t>=1.8&&t<2.5)_cbBubble('!!',px+6,gy-24,'#ff0');
  if(t>=3.2)_cbBubble('CLOSE!!',px-5,gy-24,'#0ff');
}

// ── Skit F: DASH PARRY ───────────────────────
// Player dashes in, parries at the last frame, runner blasts away
function _cbDashParry(t){
  const gy=_GY;
  const pPal=players.find(p=>p.isHuman)?.pal??P_PAL[0];
  const IMPACT_X=155;
  const px=t<1.5?30+t*83:IMPACT_X;
  const pDash=t<1.5;
  const pParry=t>=1.5&&t<2.3;
  const pFlash=t>=1.5&&t<1.8;
  // Motion lines during dash
  if(pDash){
    ctx.fillStyle='#adf';ctx.globalAlpha=0.25;
    for(let i=0;i<4;i++)ctx.fillRect((px-10-i*7)|0,gy-2+i,6,1);
    ctx.globalAlpha=1;
  }
  _cbF(()=>drawPlayer(_cbP(px,gy,0,pPal,{
    dashT:pDash?.1:0,parryT:pParry?.18:0,_dcpFlash:pFlash?.1:0,vx:pDash?28:0
  })));
  // Runner charges from right → gets blasted right
  const rImpact=IMPACT_X+12;
  if(t<1.6){
    const rx=t<1.5?W-30-t*88:rImpact;
    _cbF(()=>drawEnemy(_cbE('runner',rx,gy,Math.PI,{hit:t>=1.5?.15:0,vx:t<1.5?-28:0})));
  }else{
    const rx=rImpact+(t-1.6)*260;
    if(rx<W+20)_cbF(()=>drawEnemy(_cbE('runner',rx,gy,0,{hit:.2,anim:coffeeBreak.t*8,vx:40})));
  }
  // White flash on impact
  if(t>=1.5&&t<1.85){
    ctx.fillStyle='#fff';ctx.globalAlpha=Math.max(0,1-(t-1.5)/.35)*.7;
    ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  }
  // Impact sparks
  _cbSparks(rImpact,gy,t-1.5,.9,14,'#ff0','#fff',90);
  _cbSparks(rImpact,gy,Math.max(0,t-2.0),.7,8,'#f80','#ff0',50);
  // Bubbles
  if(t<1.2)_cbBubble('!!',W-70,gy-24,'#f44');
  if(t>=2.1&&t<5.5)_cbBubble('DASH PARRY!',105,gy-30,'#ff0');
  if(t>=3.5)_cbBubble('PERFECT!',108,gy-42,'#0ff');
}

// ── Main coffee break draw ────────────────────
function drawCoffeeBreak(){
  const cb=coffeeBreak,t=cb.t;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(let sy=0;sy<H;sy+=4){ctx.fillStyle='rgba(0,0,24,0.14)';ctx.fillRect(0,sy,W,2);}
  const dStr='DEPTH '+(stage-1)+' CLEARED';
  pixBig(dStr,Math.round((W-dStr.length*8)/2),7,'#ff0');
  ctx.globalAlpha=0.6+Math.sin(t*3)*.4;
  pixBig('COFFEE  BREAK',Math.round((W-104)/2),18,'#f80');
  ctx.globalAlpha=1;
  ctx.fillStyle='#333';ctx.fillRect(10,_GY+8,W-20,1);
  if(t<CB_DUR){
    ({chase:_cbChase,victory:_cbVictory,bomber:_cbBomber,ghost:_cbGhost,brute:_cbBrute,dashparry:_cbDashParry}[cb.skit]??_cbChase)(t);
    if(t>1){
      ctx.globalAlpha=0.35+Math.sin(t*4)*.15;
      pixText('ANY KEY TO SKIP',Math.round((W-60)/2),H-9,'#445');
      ctx.globalAlpha=1;
    }
  }else{
    // "next depth" phase (2 sec)
    const nt=t-CB_DUR;
    const a=Math.min(1,nt/.4); // fade in
    const nStr='LET\'S GO  DEPTH '+(stage);
    ctx.globalAlpha=a*(0.85+Math.sin(nt*5)*.15);
    pixBig(nStr,Math.round((W-nStr.length*8)/2),_GY-20,'#0ff');
    ctx.globalAlpha=a;
    pixText('▶▶',Math.round(W/2-8),_GY-6,'#0cf');
    ctx.globalAlpha=1;
  }
  // Gamepad skip (edge-detect)
  if(t>0.5){
    const gps=navigator.getGamepads?navigator.getGamepads():[];
    let any=false;for(const gp of gps){if(!gp)continue;any=gp.buttons.some(b=>b?.pressed);break;}
    if(any&&!_cbBtnPrev){endCoffeeBreak();return;}
    _cbBtnPrev=any;
  }
  if(t>=CB_NEXT)endCoffeeBreak();
}

// ═══════════════════════════════════════════════
//  ENDING INTRO  (D100 clear cinematic)
// ═══════════════════════════════════════════════
function drawEndingIntro(t){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(let sy=0;sy<H;sy+=4){ctx.fillStyle='rgba(0,0,24,0.14)';ctx.fillRect(0,sy,W,2);}
  const pulse=0.85+Math.sin(t*3)*.15;
  // "DEPTH 100" title
  if(t>=0.3){
    ctx.save();ctx.globalAlpha=Math.min(1,(t-.3)/.7)*pulse;
    pixBig('DEPTH 100',Math.round((W-72)/2),30,'#ff0');
    ctx.restore();
  }
  // "YOU FOUND THE SCREW"
  if(t>=0.9){
    ctx.globalAlpha=Math.min(1,(t-.9)/.6);
    pixText('YOU FOUND THE SCREW',Math.round((W-76)/2),50,'#fc8');
    ctx.globalAlpha=1;
  }
  // Screw icon (large, pulsing)
  if(t>=0.5&&t<3.8){
    const a=Math.min(1,(t-.5)/.5),p2=(Math.sin(t*8)+1)*.5;
    ctx.globalAlpha=a*(.6+p2*.4);ctx.fillStyle='#ff0';ctx.fillRect(W/2-5,H/2-5,10,10);
    ctx.globalAlpha=a;ctx.fillStyle='#fff';ctx.fillRect(W/2-3,H/2-3,6,6);
    ctx.fillStyle='#000';ctx.fillRect(W/2-1,H/2+1,3,1);ctx.fillRect(W/2+1,H/2-1,1,3);
    ctx.globalAlpha=a;pixText('SCREW',Math.round(W/2-10),H/2+9,'#ff0');
    ctx.globalAlpha=1;
  }
  // Player + allies escape to the right (t=1.8-4.0)
  if(t>=1.8&&t<4.2){
    const wt=t-1.8;
    const pPal=players.find(p=>p.isHuman)?.pal??P_PAL[0];
    const px=W/2-10+wt*52;
    const sv=time;time=t;
    drawPlayer(_cbP(px,H/2+10,0,pPal,{vx:20}));
    const alive=players.filter(p=>!p.isHuman&&p.alive).slice(0,2);
    alive.forEach((al,i)=>{drawPlayer(_cbP(px-14-i*13,H/2+10,0,al.pal,{idx:al.idx,vx:20}));});
    time=sv;ctx.globalAlpha=1;
  }
  // Fade to white → regular win screen
  if(t>=3.8){
    ctx.fillStyle='#fff';ctx.globalAlpha=Math.min(1,(t-3.8)/.8);
    ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  }
  // Skip hint
  ctx.globalAlpha=0.3+Math.sin(t*3)*.1;
  pixText('ANY KEY TO SKIP',Math.round((W-60)/2),H-10,'#445');
  ctx.globalAlpha=1;
  // Gamepad skip
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  let any=false;for(const gp of gps){if(!gp)continue;any=gp.buttons.some(b=>b?.pressed);break;}
  if(any&&!_endGpPrev&&t>0.5)endingT=5;
  _endGpPrev=any;
}

//  MUSIC PLAY MODE
// ═══════════════════════════════════════════════
let musicPlayMode=false,musicPlayT=0,musicPlaySong=0;
let _mpPadPrev={};

const MUSIC_SONGS=[
  {label:'TITLE BGM',   play:()=>PSG.title()},
  {label:'COFFEE BREAK',play:()=>PSG.jingle()},
  {label:'ZONE 1',      play:()=>PSG.play(1)},
  {label:'ZONE 2',      play:()=>PSG.play(21)},
  {label:'ZONE 3',      play:()=>PSG.play(41)},
  {label:'ZONE 4',      play:()=>PSG.play(61)},
  {label:'ZONE 5',      play:()=>PSG.play(81)},
  {label:'BOSS',        play:()=>PSG.boss(10)},
  {label:'MONSTER HOUSE',play:()=>PSG.mhouse(1)},
];
const _MP_ENEMIES=['grunt','runner','shooter','bomber','ghost','brute'];
const _MP_GY=110;

function startMusicPlay(){
  musicPlayMode=true;musicPlayT=0;musicPlaySong=0;
  MUSIC_SONGS[0].play();
}
function stopMusicPlay(){
  musicPlayMode=false;
  PSG.title();
  lobbyEl.style.display='flex';renderLobby();
}
function _mpChangeSong(dir){
  musicPlaySong=(musicPlaySong+dir+MUSIC_SONGS.length)%MUSIC_SONGS.length;
  MUSIC_SONGS[musicPlaySong].play();
}

function drawMusicPlay(dt){
  musicPlayT+=dt;
  const t=musicPlayT;

  // Background
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(let sy=0;sy<H;sy+=4){ctx.fillStyle='rgba(0,0,24,0.14)';ctx.fillRect(0,sy,W,2);}

  // Title
  ctx.globalAlpha=0.85+Math.sin(t*2.5)*.15;
  pixBig('MUSIC PLAY',Math.round((W-80)/2),7,'#f80');
  ctx.globalAlpha=1;

  // Song name with arrows
  const song=MUSIC_SONGS[musicPlaySong];
  const lArr=musicPlaySong>0?'<':' ';
  const rArr=musicPlaySong<MUSIC_SONGS.length-1?'>':' ';
  const nameStr=lArr+' '+song.label+' '+rArr;
  pixText(nameStr,Math.round((W-nameStr.length*4)/2),20,'#ff0');

  // Dot indicators
  const dotSpan=MUSIC_SONGS.length*6;
  const dotX0=Math.round((W-dotSpan)/2);
  for(let i=0;i<MUSIC_SONGS.length;i++){
    ctx.fillStyle=i===musicPlaySong?'#ff0':'#334';
    ctx.fillRect(dotX0+i*6,29,4,2);
  }

  // Ground line
  ctx.fillStyle='#333';ctx.fillRect(10,_MP_GY+8,W-20,1);

  // Dancing enemies
  const n=_MP_ENEMIES.length;
  const span=W-60;
  for(let i=0;i<n;i++){
    const type=_MP_ENEMIES[i];
    const phase=i*Math.PI*2/n;
    const ex=Math.round(30+span*i/(n-1));
    // bounce: up-down in rhythm
    const bounce=Math.sin(t*3.5+phase)*5;
    const ey=_MP_GY+bounce;
    // spin angle
    const ang=t*2+phase;
    const e=makeEnemy(type,ex,ey);
    e.ang=ang;e.anim=t*3+phase*0.5;e.hit=0;e._dead=false;
    const sv=time;time=t+phase*0.3;
    drawEnemy(e);
    time=sv;ctx.globalAlpha=1;
    // name label
    const lbl=type.toUpperCase();
    pixText(lbl,Math.round(ex-lbl.length*2),_MP_GY+12,'#446');
  }

  // Controls hint
  ctx.globalAlpha=0.4+Math.sin(t*3)*.1;
  pixText('LEFT/RIGHT: SONG    ESC: EXIT',Math.round((W-116)/2),H-9,'#445');
  ctx.globalAlpha=1;

  // Gamepad support
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  let gp=null;for(const g of gps){if(g){gp=g;break;}}
  if(gp){
    const edge=(k,v)=>{const r=v&&!_mpPadPrev[k];_mpPadPrev[k]=v;return r;};
    const ax=gp.axes[0]||0;
    if(edge('R',(gp.buttons[15]?.pressed)||ax>0.5))_mpChangeSong(1);
    if(edge('L',(gp.buttons[14]?.pressed)||ax<-0.5))_mpChangeSong(-1);
    if(edge('B',gp.buttons[1]?.pressed))stopMusicPlay();
  }else{_mpPadPrev={};}
}

// ── Pause overlay (canvas-rendered) ──────────
const pauseBtns={};
function pBtnPri(key,label,x,y,w,h,col){
  pauseBtns[key]={x,y,w,h};
  const hov=(mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h)||_ovlPadFocus===key;
  ctx.fillStyle=hov?col:'#040c14';ctx.fillRect(x,y,w,h);
  ctx.fillStyle=col;
  ctx.fillRect(x,y,w,1);ctx.fillRect(x,y+h-1,w,1);ctx.fillRect(x,y,1,h);ctx.fillRect(x+w-1,y,1,h);
  pixText(label,x+Math.round((w-label.length*4)/2),y+Math.round((h-6)/2),hov?'#000':col);
}
function drawPause(){
  Object.keys(pauseBtns).forEach(k=>delete pauseBtns[k]);
  // dark overlay + scanlines
  ctx.fillStyle='rgba(0,0,0,0.74)';ctx.fillRect(0,0,W,H);
  for(let sy=0;sy<H;sy+=4){ctx.fillStyle='rgba(0,0,24,0.18)';ctx.fillRect(0,sy,W,2);}
  // PAUSED title (slow pulse)
  const t=performance.now()/1000;
  const pulse=0.82+Math.sin(t*2.8)*0.14;
  const pc=Math.round(255*pulse).toString(16).padStart(2,'0');
  pixBig('PAUSED',(W-48)/2,52,`#00${pc}${pc}`);
  // separator
  ctx.fillStyle='rgba(0,200,255,0.28)';ctx.fillRect(W/2-36,67,72,1);
  // buttons (72px wide, centered)
  const bw=72,bx=Math.round((W-bw)/2);
  pBtnPri('resume','RESUME',bx,75,bw,13,'#0ff');
  pBtnPri('squit','SAVE & QUIT',bx,90,bw,13,'#0c9');
  pBtnPri('quit','QUIT NO SAVE',bx,105,bw,13,'#f55');
  // ESC hint
  pixText('ESC = RESUME',(W-48)/2,122,'#334');
}
function pauseHandleClick(){
  for(const[k,b]of Object.entries(pauseBtns)){
    if(mouse.x>=b.x&&mouse.x<b.x+b.w&&mouse.y>=b.y&&mouse.y<b.y+b.h){
      if(k==='resume'){setPause(false);return;}
      if(k==='squit'){saveGame();setPause(false);running=false;PSG.stop();lobbyEl.style.display='flex';renderLobby();PSG.title();return;}
      if(k==='quit'){setPause(false);running=false;PSG.stop();lobbyEl.style.display='flex';renderLobby();PSG.title();return;}
    }
  }
}

function iChar(sx,sy,pal,sc,dead=false,aim=0){
  ctx.save();ctx.translate(sx,sy);ctx.scale(sc,sc);
  ctx.fillStyle='#000';ctx.globalAlpha=.3;ctx.fillRect(-3,2,6,2);ctx.globalAlpha=1;
  ctx.fillStyle=pal.body;ctx.fillRect(-2,-3,4,6);
  ctx.fillStyle=pal.head;ctx.fillRect(-2,-5,4,3);
  if(dead){
    ctx.fillStyle='#f44';ctx.fillRect(-2,-4,1,1);ctx.fillRect(0,-4,1,1);
    ctx.fillStyle='#000';ctx.fillRect(-1,-4,1,1);ctx.fillRect(1,-4,1,1);
  }else{
    ctx.fillStyle='#000';ctx.fillRect(-1,-4,1,1);ctx.fillRect(0,-4,1,1);
  }
  const bob=dead?0:((introT*12)|0)%2;
  ctx.fillStyle=pal.dark;ctx.fillRect(-2,3,1,2-bob);ctx.fillRect(1,3,1,1+bob);
  if(!dead){
    ctx.fillStyle='#aaa';
    for(let i=0;i<5;i++)ctx.fillRect(Math.round(Math.cos(aim)*(3+i)),Math.round(Math.sin(aim)*(3+i)),1,1);
  }
  ctx.restore();
}

// Large animated enemy sprite for gallery (scale applied externally via translate/scale)
function iEnemyLarge(cx,cy,type,sc,t,tier){
  ctx.save();ctx.translate(Math.round(cx),Math.round(cy));ctx.scale(sc,sc);
  // ── Boss ──────────────────────────────────────────────
  if(type==='boss'){
    const isFinal=tier==='final';
    let _bc,_hc,_belt,_eye;
    if(isFinal)            {_bc='#0d0b18';_hc='#0d0b18';_belt='#0d0b18';_eye='#0d0b18';}
    else if(tier==='red')  {_bc='#c22';_hc='#811';_belt='#f44';_eye='#f66';}
    else if(tier==='yellow'){_bc='#886';_hc='#553';_belt='#aa8';_eye='#ff8';}
    else                   {_bc='#622';_hc='#411';_belt='#833';_eye='#f00';}
    const pulse=Math.abs(Math.sin(t*5));
    // Final boss: glow aura
    if(isFinal){ctx.fillStyle='#1a0030';ctx.globalAlpha=.4+pulse*.2;ctx.fillRect(-18,-18,36,36);ctx.globalAlpha=1;}
    // Shadow
    ctx.fillStyle='#000';ctx.globalAlpha=.45;ctx.fillRect(-10,10,20,4);ctx.globalAlpha=1;
    // Extra appendages (red/final)
    if(tier==='red'||isFinal){ctx.fillStyle=_bc;ctx.fillRect(-15,-2,6,4);ctx.fillRect(9,-2,6,4);}
    // Spikes top/bottom (final only)
    if(isFinal){ctx.fillStyle=_bc;ctx.fillRect(-2,-15,4,6);ctx.fillRect(-2,9,4,6);}
    // Fists
    ctx.fillStyle=_bc;ctx.fillRect(-13,-4,5,5);ctx.fillRect(8,-4,5,5);
    // Body + belt
    ctx.fillStyle=_bc;ctx.fillRect(-6,-6,12,14);
    ctx.fillStyle=_belt;ctx.fillRect(-6,1,12,2);
    // Head
    ctx.fillStyle=_hc;ctx.fillRect(-5,-11,10,6);
    // Eyes
    if(!isFinal){ctx.fillStyle=_eye;ctx.globalAlpha=0.6+pulse*.4;ctx.fillRect(-4,-9,3,2);ctx.fillRect(1,-9,3,2);ctx.globalAlpha=1;}
    // Legs
    const lb=((t*7)|0)%2;
    ctx.fillStyle=isFinal?'#0d0b18':'#400';ctx.fillRect(-5,8,4,4-lb);ctx.fillRect(1,8,4,3+lb);
    // Orbiting gem (non-final only)
    if(!isFinal){const ox=Math.round(Math.cos(t*2.5)*13),oy=Math.round(Math.sin(t*2.5)*13);
      ctx.fillStyle=tier==='yellow'?'#ff8':tier==='red'?'#f44':'#f00';ctx.globalAlpha=.5+pulse*.5;
      ctx.fillRect(ox-1,oy-1,3,3);ctx.globalAlpha=1;}
    ctx.globalAlpha=1;ctx.restore();return;
  }
  // ── Gatekeeper ────────────────────────────────────
  if(type==='gatekeeper'){
    const pulse=(Math.sin(t*5)+1)*.5;
    ctx.fillStyle='#000';ctx.globalAlpha=.3;ctx.fillRect(-7,7,14,3);ctx.globalAlpha=1;
    ctx.fillStyle='#600';ctx.fillRect(-6,-6,12,12);
    ctx.fillStyle='#f44';ctx.globalAlpha=.5+pulse*.5;ctx.fillRect(-4,-4,8,8);ctx.globalAlpha=1;
    ctx.fillStyle='#f88';ctx.fillRect(-1,-6,2,12);ctx.fillRect(-6,-1,12,2);
    ctx.globalAlpha=1;ctx.restore();return;
  }
  let body,head;
  if(type==='grunt')    {body='#494';head='#7a7';}
  else if(type==='runner')  {body='#963';head='#c85';}
  else if(type==='brute')   {body='#722';head='#a44';}
  else if(type==='shooter') {body='#549';head='#86c';}
  else if(type==='poison')  {body='#362';head='#594';}
  else if(type==='splatter'){body='#639';head='#96c';}
  else if(type==='dasher')  {body='#a50';head='#c80';}
  else if(type==='ghost')   {body='#8af';head='#adf';}
  else if(type==='bomber')  {body='#622';head='#944';}
  // shadow
  ctx.fillStyle='#000';ctx.globalAlpha=.3;ctx.fillRect(-5,6,10,2);ctx.globalAlpha=1;
  if(type==='brute'){
    const sw=Math.round(Math.sin(t*2));
    ctx.fillStyle=body;ctx.fillRect(-6,-2+sw,2,3);ctx.fillRect(4,-2-sw,2,3); // arms
    ctx.fillStyle=body;ctx.fillRect(-4,-4,8,7);
    ctx.fillStyle=head;ctx.fillRect(-3,-6,6,3);
    ctx.fillStyle='#f00';ctx.fillRect(-2,-5,1,1);ctx.fillRect(1,-5,1,1);
  } else if(type==='shooter'){
    const ang=Math.sin(t*1.4)*.6;
    ctx.fillStyle=body;ctx.fillRect(-2,-3,4,6);ctx.fillStyle=head;ctx.fillRect(-2,-5,4,3);
    ctx.fillStyle='#ff0';ctx.fillRect(-1,-4,1,1);ctx.fillRect(0,-4,1,1);
    ctx.fillStyle='#aaa';
    for(let i=1;i<=3;i++)ctx.fillRect(Math.round(Math.cos(ang)*i*1.5)-1,Math.round(Math.sin(ang)*i*1.5)-2,1,1);
  } else if(type==='runner'){
    const rl=((t*18)|0)%2;
    ctx.fillStyle=head;ctx.fillRect(-1,-7,2,2);
    ctx.fillStyle=body;ctx.fillRect(-1,-5,2,6);
    ctx.fillStyle='#f80';ctx.fillRect(-1,-6,1,1);
    ctx.fillStyle=body;ctx.fillRect(-2,1,1,2+rl);ctx.fillRect(1,1,1,3-rl);
    ctx.fillStyle=body;ctx.fillRect(-3,-3,1,2);ctx.fillRect(2,-4,1,2);
  } else if(type==='ghost'){
    const bob=Math.round(Math.sin(t*2.8));
    ctx.globalAlpha=0.5+Math.sin(t*4)*.18;
    ctx.fillStyle=body;
    ctx.fillRect(-1,-9+bob,2,3);ctx.fillRect(-2,-7+bob,4,3);ctx.fillRect(-3,-4+bob,6,5);
    ctx.fillRect(-2,1+bob,2,2);ctx.fillRect(0,1+bob,2,2);
    ctx.fillStyle=head;ctx.fillRect(-2,-3+bob,1,1);ctx.fillRect(0,-3+bob,1,1);
    ctx.globalAlpha=1;
  } else if(type==='bomber'){
    const spk=((t*8)|0)%2;
    ctx.fillStyle=spk?'#ff0':'#fa8';ctx.fillRect(0,-10,1,2);
    ctx.fillStyle='#aaa';ctx.fillRect(0,-8,1,3);
    ctx.fillStyle=head;ctx.fillRect(-2,-5,3,2);
    ctx.fillStyle=body;ctx.fillRect(-3,-3,6,7);
    ctx.fillStyle='#844';ctx.fillRect(-3,0,6,1);
    ctx.fillStyle='#f22';
    ctx.fillRect(-2,-2,1,1);ctx.fillRect(1,-2,1,1);ctx.fillRect(-1,-1,1,1);ctx.fillRect(0,-1,1,1);
  } else if(type==='splatter'){
    const dr=((t*4)|0)%3;
    ctx.fillStyle=body;
    ctx.fillRect(-2,-5,4,2);ctx.fillRect(-3,-4,6,4);ctx.fillRect(-4,0,8,4);
    ctx.fillStyle=head;ctx.fillRect(-2,-3,1,1);ctx.fillRect(0,-3,1,1);
    ctx.fillStyle=body;
    ctx.fillRect(-3,4,1,1+dr);ctx.fillRect(-1,4,1,1+((dr+1)%3));ctx.fillRect(1,4,1,1+((dr+2)%3));
  } else if(type==='dasher'){
    const dl=((t*10)|0)%2;
    ctx.fillStyle=head;ctx.fillRect(2,-3,3,2);
    ctx.fillStyle=body;ctx.fillRect(-3,-1,7,3);
    ctx.fillStyle='#ff4';ctx.fillRect(3,-3,1,1);
    ctx.fillStyle=body;ctx.fillRect(-3,2,2,1+dl);ctx.fillRect(0,2,2,2-dl);
  } else if(type==='poison'){
    const bob=Math.round(Math.sin(t*1.8)*.7);
    ctx.fillStyle=head;ctx.fillRect(-2,-7+bob,4,2);ctx.fillRect(-3,-5+bob,6,3);
    ctx.fillStyle='#2a5';ctx.fillRect(-2,-6+bob,1,1);ctx.fillRect(0,-5+bob,1,1);ctx.fillRect(1,-6+bob,1,1);
    ctx.fillStyle='#9c9';ctx.fillRect(-3,-2+bob,6,1);
    ctx.fillStyle=body;ctx.fillRect(-1,-1,2,4);
  } else {
    // GRUNT
    const reach=Math.round(Math.sin(t*3));
    ctx.fillStyle=body;ctx.fillRect(-2,-2,4,5);ctx.fillStyle=head;ctx.fillRect(-2,-4,4,3);
    ctx.fillStyle='#f00';ctx.fillRect(-1,-3,1,1);ctx.fillRect(0,-3,1,1);
    ctx.fillStyle=body;ctx.fillRect(-3,-1+reach,1,2);ctx.fillRect(2,-1-reach,1,2);
  }
  ctx.globalAlpha=1;ctx.restore();
}

function _lobbyPadNav(){
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  let gp=null;for(let i=0;i<gps.length;i++)if(gps[i]){gp=gps[i];break;}
  if(!gp){padStatus='NO GAMEPAD DETECTED';return;}
  padStatus=gp.id.slice(0,36);
  const edge=(k,v)=>{const r=v&&!_lobbyPadPrev[k];_lobbyPadPrev[k]=v;return r;};
  const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  const dL=edge('dL',(gp.buttons[14]?.pressed)||ax<-0.5);
  const dR=edge('dR',(gp.buttons[15]?.pressed)||ax>0.5);
  const dU=edge('dU',(gp.buttons[12]?.pressed)||ay<-0.5);
  const dD=edge('dD',(gp.buttons[13]?.pressed)||ay>0.5);
  const ok=edge('A',gp.buttons[0]?.pressed);
  if(!(dL||dR||dU||dD||ok))return;
  lobbyIdleT=0;
  const hasCont=!!hasSave();
  const grid=[
    ['cpu0','cpu1','cpu2','cpu3'],
    ['kbm','pad'],
    ['start'],
    ...(hasCont?[['cont']]:[]),
    ['how'],
    ...(cfg.slots[0]==='GAMEPAD'?[['padcfg']]:[]),
  ];
  let ri=2,ci=0;
  for(let r=0;r<grid.length;r++){const c=grid[r].indexOf(lobbyPadFocus);if(c>=0){ri=r;ci=c;break;}}
  if(dR)ci=Math.min(ci+1,grid[ri].length-1);
  if(dL)ci=Math.max(ci-1,0);
  if(dD){ri=Math.min(ri+1,grid.length-1);ci=Math.min(ci,grid[ri].length-1);}
  if(dU){ri=Math.max(ri-1,0);ci=Math.min(ci,grid[ri].length-1);}
  lobbyPadFocus=grid[ri][ci];
  // Toggle-style buttons update immediately on focus
  if(lobbyPadFocus.startsWith('cpu'))cfg.cpus=+lobbyPadFocus[3];
  else if(lobbyPadFocus==='kbm')cfg.slots[0]='KB+M';
  else if(lobbyPadFocus==='pad')cfg.slots[0]='GAMEPAD';
  if(ok){
    const k=lobbyPadFocus;
    if(k==='start')startGame();
    else if(k==='cont')loadGame();
    else if(k==='how')startIntro();
    else if(k==='padcfg'){padConfigActive=true;padCfgFocus=0;padCfgWaiting=false;_padCfgPrev={};}
  }
}

function padCfgNav(){
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  let gp=null;for(let i=0;i<gps.length;i++)if(gps[i]){gp=gps[i];break;}
  if(!gp)return;
  const edge=(k,v)=>{const r=v&&!_padCfgPrev[k];_padCfgPrev[k]=v;return r;};
  // Snapshot all currently-pressed buttons so no release/re-edge fires after assign or cancel
  const snapPrev=()=>{
    _padCfgPrev={};
    for(let j=0;j<gp.buttons.length;j++)_padCfgPrev['b'+j]=!!(gp.buttons[j]?.pressed||(gp.buttons[j]?.value>.5));
    _padCfgPrev.cancel=!!(gp.buttons[1]?.pressed);
    _padCfgPrev.a=!!(gp.buttons[0]?.pressed);
    _padCfgPrev.b=!!(gp.buttons[1]?.pressed);
    _padCfgPrev.u=false;_padCfgPrev.d=false;
  };
  if(padCfgWaiting){
    const ignore=new Set([8,9,12,13,14,15]);
    for(let i=0;i<gp.buttons.length;i++){
      if(ignore.has(i))continue;
      if(edge('b'+i,!!(gp.buttons[i]?.pressed||(gp.buttons[i]?.value>.5)))){
        padConfig[PAD_ACT_KEYS[padCfgFocus]]=i;
        savePadConfig();
        padCfgWaiting=false;snapPrev();break;
      }
    }
    if(edge('cancel',gp.buttons[1]?.pressed)){padCfgWaiting=false;snapPrev();}
    return;
  }
  const up=edge('u',(gp.buttons[12]?.pressed)||(gp.axes[1]||0)<-0.5);
  const dn=edge('d',(gp.buttons[13]?.pressed)||(gp.axes[1]||0)>0.5);
  const ok=edge('a',gp.buttons[0]?.pressed);
  const back=edge('b',gp.buttons[1]?.pressed);
  if(up)padCfgFocus=Math.max(0,padCfgFocus-1);
  if(dn)padCfgFocus=Math.min(PAD_ACT_KEYS.length-1,padCfgFocus+1);
  if(ok){padCfgWaiting=true;snapPrev();}
  if(back){padConfigActive=false;_padCfgPrev={};}
}

function lobbyHandleClick(){
  lobbyIdleT=0;

    if(mouse.x>=b.x&&mouse.x<b.x+b.w&&mouse.y>=b.y&&mouse.y<b.y+b.h){

      if(k==='start'){startGame();return;}

  }

    pixText(ei.nag,Math.round((W-ei.nag.length*4)/2),131,'#567');
    // Left / Right navigation arrows
    const isFirst=introEnemyIdx===0,isLast=introEnemyIdx===INTRO_ENEMIES.length-1;
    ctx.globalAlpha=isFirst?.18:.7;
    pixText('◄',6,79,'#0cf'); // ◄
    ctx.globalAlpha=isLast?.18:.7;
    pixText('►',W-10,79,'#0cf'); // ►
    ctx.globalAlpha=1;
    // Enemy index dots
    const dotN=INTRO_ENEMIES.length,dotW=dotN*8-3;
    for(let i=0;i<dotN;i++){
      ctx.fillStyle=i===introEnemyIdx?ei.col:'#234';
      ctx.fillRect(Math.round((W-dotW)/2)+i*8,H-18,5,3);
    }
    // BACK TO TITLE button (last enemy) or hint
    if(isLast){
      const bx=W/2-30,by=H-28,bw=60,bh=12;
      const hov=mouse.x>=bx&&mouse.x<=bx+bw&&mouse.y>=by&&mouse.y<=by+bh;
      ctx.fillStyle=hov?'#0ff':'#081820';ctx.fillRect(bx,by,bw,bh);
      pixText('BACK TO TITLE',bx+4,by+3,hov?'#000':'#0ff');
    }else{
      pixText('SPACE : NEXT',(W-48)/2,H-28,'#345');
    }
  }
}

// ── Bullet Time overlay (canvas-rendered) ─────────
function drawBulletTime(){
  if(!bulletTime)return;
  // Dramatic vignette
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.75);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.72)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // Victim name + DIED!
  const col=bulletTime.victimPal.body;
  const name=bulletTime.victimName+' DIED!';
  pixBig(name,Math.floor((W-name.length*8)/2),52,col);
  // Countdown (pixHuge = 4x)
  const c=bulletTime.timer>.3?String(Math.max(0,Math.ceil(bulletTime.timer-.3))):'GO!';
  const pulse=0.8+Math.sin(performance.now()/150)*0.2;
  ctx.save();ctx.globalAlpha=pulse;
  pixHuge(c,Math.floor((W-c.length*16)/2),72,'#fff');
  ctx.restore();
  // Subtitle
  const sub='BRACE FOR ZOMBIE';
  pixText(sub,Math.floor((W-sub.length*4)/2),108,'#f44');
}

const goBtns={};
function goBtnPri(key,label,x,y,w,h,col){

function drawGameOver(){

function goHandleClick(){

function _ovlPadNav(){
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  let gp=null;for(let i=0;i<gps.length;i++)if(gps[i]){gp=gps[i];break;}
  if(!gp)return;
  const edge=(k,v)=>{const r=v&&!_ovlPadPrev[k];_ovlPadPrev[k]=!!v;return r;};
  const ay=gp.axes[1]||0;
  const dU=edge('U',(gp.buttons[12]?.pressed)||ay<-.5);
  const dD=edge('D',(gp.buttons[13]?.pressed)||ay>.5);
  const ok=edge('A',gp.buttons[0]?.pressed);
  const back=edge('B',gp.buttons[1]?.pressed);
  if(paused){
    const order=['resume','squit','quit'];
    if(!order.includes(_ovlPadFocus))_ovlPadFocus='resume';
    let i=order.indexOf(_ovlPadFocus);
    if(dU)i=Math.max(0,i-1);
    if(dD)i=Math.min(order.length-1,i+1);
    _ovlPadFocus=order[i];
    if(back){setPause(false);_ovlPadFocus='';_ovlPadPrev={};}
    else if(ok){
      if(_ovlPadFocus==='resume'){setPause(false);}
      else if(_ovlPadFocus==='squit'){saveGame();setPause(false);running=false;PSG.stop();lobbyEl.style.display='flex';renderLobby();PSG.title();}
      else if(_ovlPadFocus==='quit'){setPause(false);running=false;PSG.stop();lobbyEl.style.display='flex';renderLobby();PSG.title();}
      _ovlPadFocus='';_ovlPadPrev={};
    }
  }else if(gameOverState){
    _ovlPadFocus='retry';
    if(ok||back){gameOverState=false;lobbyEl.style.display='flex';renderLobby();PSG.title();_ovlPadFocus='';_ovlPadPrev={};}
  }else if(gameWon){
    _ovlPadFocus='again';
    if(ok||back){gameWon=false;lobbyEl.style.display='flex';renderLobby();PSG.title();_ovlPadFocus='';_ovlPadPrev={};}
  }
}


// ═══════════════════════════════════════════════
//  TUTORIAL
// ═══════════════════════════════════════════════
let tutorialActive=false,tutStep=0,tutT=0;
let _tutStartX=0,_tutStartY=0;
let _tutDashed=false,_tutPrevCallCd=0;
let _tutSecretSet=false,_tutCompleteT=0;

const _TUT_GATE_XS=[11,21,31,41,51];

const _TUT_STEPS=[
  {label:'MOVE',   key:'WASD / ARROW KEYS',        sub:'Walk around the room'},
  {label:'SHOOT',  key:'AIM+CLICK / RIGHT STICK',  sub:'Defeat the enemy!'},
  {label:'DASH',   key:'SPACE or F / R2 + direction', sub:'Dash through the gap!'},
  {label:'PARRY',  key:'DASH into enemy bullet',     sub:'Deflect the shot!'},
  {label:'CALL',   key:'TAB / SELECT',             sub:'Call your CPU allies!'},
  {label:'WEAPON', key:'Shoot the golden wall',    sub:'3 hits to reveal a weapon!'},
];

function genTutorialMap(){
  map=new Uint8Array(MAPW*MAPH);map.fill(1);
  fog=new Uint8Array(MAPW*MAPH);fog.fill(1); // fully revealed

  // 6 rooms, each 9 tiles wide × 10 tall, at rows y=5..14
  const roomRanges=[[2,10],[12,20],[22,30],[32,40],[42,50],[52,60]];
  for(const [x0,x1] of roomRanges)
    for(let y=5;y<=14;y++)
      for(let x=x0;x<=x1;x++)
        map[y*MAPW+x]=0;

  // DASH room (room 2: x=22-30): pillars, leave y=9-10 open
  for(let x=24;x<=27;x++){
    for(let y=5;y<=8;y++) map[y*MAPW+x]=1;
    for(let y=11;y<=14;y++) map[y*MAPW+x]=1;
  }

  // Secret wall tile in room 5 (x=56, y=9-10) — re-wall after carve
  map[9*MAPW+56]=1;map[10*MAPW+56]=1;

  // Floor variation
  for(let i=0;i<map.length;i++)
    if(map[i]===0&&Math.random()<0.05)map[i]=2;

  rooms_=[];exits=[];cores=[];pods=[];screwObj=null;
  coresNeeded=1;coresCollected=0;exitOpen=false; // coresNeeded=1 prevents auto-exit-open
}

function startTutorial(){
  tutorialActive=true;tutStep=0;tutT=0;
  _tutDashed=false;_tutPrevCallCd=0;
  _tutSecretSet=false;_tutCompleteT=0;
  _hasDashParried=false;

  stage=1;totalKills=0;gameWon=false;gameOverState=false;
  monsterHouse=false;monsterHouseCleared=false;mhSpawnPending=0;
  bullets=[];ebullets=[];enemies=[];particles=[];pickups=[];
  messages=[];gatekeepers=[];poisonPuddles=[];npcs=[];
  bulletTime=null;paused=false;
  driverActive=false;overdriveActive=false;vertidriveActive=false;laserActive=false;
  callCooldown=0;callAggroTimer=0;

  players=[];
  const slot=cfg.slots[0]||'KB+M';
  const ctrl=slot==='GAMEPAD'?new PadController():new KMController();
  const human=makePlayer(0,ctrl,true);
  human.hp=human.maxHp=9999; // immortal in tutorial
  players.push(human);
  const cpu=makePlayer(1,new CPUController('bodyguard'),false);
  cpu.hp=cpu.maxHp=9999;
  players.push(cpu);

  genTutorialMap();

  const sx=6*TILE+8,sy=9*TILE+8;
  human.x=sx;human.y=sy;
  cpu.x=sx-14;cpu.y=sy+10;
  _tutStartX=sx;_tutStartY=sy;

  // Dummy enemy in room 1 — moves naturally (easier to shoot when it approaches)
  const dummy=makeEnemy('grunt',16*TILE+8,9*TILE+8);
  dummy.hp=3;dummy._tutDummy=true;
  enemies.push(dummy);

  // Stationary turret (shooter) in room 3 — very high HP so it can't be killed
  const turret=makeEnemy('shooter',36*TILE+8,9*TILE+8);
  turret.spd=0;turret._tutTurret=true;
  turret.hp=turret.maxHp=999;
  enemies.push(turret);

  // Secret wall pre-hit 22/25 → 3 shots needed
  secretWallPos={tx:56,ty:9};
  secretWallHits=22;
  _tutSecretSet=true;

  camX=sx;camY=sy;
  spawnT=9999;running=true;
  PSG.stop();
  cv.classList.toggle('cur',slot!=='KB+M');
  lobbyEl.style.display='none';
}

function _tutOpenGate(step){
  const gx=_TUT_GATE_XS[step];
  for(let gy=9;gy<=10;gy++){map[gy*MAPW+gx]=0;fog[gy*MAPW+gx]=1;}
}

function _tutAdvance(){
  const hp=humanPlayer();
  if(tutStep<5){
    _tutOpenGate(tutStep);
    flash(_TUT_STEPS[tutStep].label+': CLEAR!','#0f0');
    if(hp)spark(hp.x,hp.y,'#0f0',12,90);
  }
  tutStep++;tutT=0;
  _tutPrevCallCd=callCooldown; // sync so new TAB press is needed for step 4
  if(tutStep>=6){
    localStorage.setItem('tut_done','1');
    flash('TUTORIAL COMPLETE!','#ff0');
    if(hp)spark(hp.x,hp.y,'#ff0',24,130);
    _tutCompleteT=4;
  }
}

function updateTutorial(dt){
  spawnT=9999; // prevent regular enemy spawns
  // Safety net: prevent game-over interrupting tutorial
  if(!running||gameOverState){running=true;gameOverState=false;_goT=0;}

  if(tutStep>=6){
    _tutCompleteT-=dt;
    if(_tutCompleteT<=0)endTutorial();
    return;
  }
  tutT+=dt;
  const hp=humanPlayer();if(!hp)return;

  switch(tutStep){
    case 0: // MOVE
      if(Math.hypot(hp.x-_tutStartX,hp.y-_tutStartY)>28)_tutAdvance();
      break;
    case 1: // SHOOT — dummy killed
      if(!enemies.some(e=>e._tutDummy))_tutAdvance();
      break;
    case 2: // DASH
      if(hp.dashT>0&&!_tutDashed){_tutDashed=true;_tutAdvance();}
      break;
    case 3: // PARRY
      if(_hasDashParried)_tutAdvance();
      break;
    case 4: // CALL THEM
      if(_tutPrevCallCd<=0&&callCooldown>0)_tutAdvance();
      _tutPrevCallCd=callCooldown;
      break;
    case 5: // SECRET WALL — cleared when secretWallPos becomes null
      if(_tutSecretSet&&!secretWallPos)_tutAdvance();
      break;
  }
}

function endTutorial(){
  tutorialActive=false;
  running=false;gameOverState=false;gameWon=false;bulletTime=null;
  driverActive=false;overdriveActive=false;vertidriveActive=false;laserActive=false;
  secretWallPos=null;secretWallHits=0;
  lobbyEl.style.display='flex';
  renderLobby();PSG.title();
}

function drawTutorialOverlay(){
  // Complete screen
  if(tutStep>=6){
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(0,H/2-18,W,36);
    const m='TUTORIAL COMPLETE!';
    pixText(m,Math.floor((W-m.length*4)/2),H/2-8,'#ff0');
    const m2='RETURNING TO LOBBY...';
    pixText(m2,Math.floor((W-m2.length*4)/2),H/2+4,'#0ff');
    ctx.restore();
    return;
  }

  const step=_TUT_STEPS[tutStep];

  // ── Top instruction bar ──
  ctx.save();
  ctx.fillStyle='rgba(0,0,20,0.85)';
  ctx.fillRect(0,0,W,22);

  // Progress dots (6 steps)
  const dotTotalW=6*9-2;
  const dotX0=Math.floor((W-dotTotalW)/2);
  for(let i=0;i<6;i++){
    ctx.fillStyle=i<tutStep?'#0f0':i===tutStep?'#ff0':'#224';
    ctx.fillRect(dotX0+i*9,3,7,4);
  }
  pixText(step.label,Math.floor((W-step.label.length*4)/2),10,'#ff0');
  pixText(step.key,Math.floor((W-step.key.length*4)/2),17,'#8bc');
  ctx.restore();

  // ── Bottom skip hint ──
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillRect(W-38,H-10,38,10);
  pixText('ESC:SKIP',W-35,H-8,'#345');
  ctx.restore();

  // ── Arrow → pointing to next gate (when off-screen right) ──
  if(tutStep<5){
    const hp=humanPlayer();
    if(hp){
      const gatePixX=_TUT_GATE_XS[tutStep]*TILE+8;
      const screenX=gatePixX-(camX-W/2);
      if(screenX>W-16){
        const blink=(performance.now()/400|0)%2===0;
        if(blink){
          ctx.save();ctx.fillStyle='#ff0';
          ctx.beginPath();
          ctx.moveTo(W-10,H/2-5);
          ctx.lineTo(W-4,H/2);
          ctx.lineTo(W-10,H/2+5);
          ctx.fill();
          ctx.restore();
        }
      }
    }
  }

  // ── Golden highlight box around secret wall ──
  if(tutStep===5){
    const wallPixX=56*TILE+8,wallPixY=9*TILE+8;
    const sx=wallPixX-(camX-W/2),sy_=wallPixY-(camY-H/2);
    const blink=(performance.now()/300|0)%2===0;
    if(blink&&sx>0&&sx<W&&sy_>0&&sy_<H){
      ctx.save();
      ctx.strokeStyle='#ffd700';ctx.lineWidth=1;
      ctx.strokeRect(sx-8,sy_-8,16,16);
      ctx.restore();
    }
  }
}

// ═══════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════
let last=performance.now();
(function loop(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(musicPlayMode){
    drawMusicPlay(dt);
  }else if(introActive){
    introT+=dt;
    pollIntroGamepad();
    drawIntro();
  }else if(lobbyEl.style.display!=='none'){
    drawLobbyCanvas(dt);
  }else if(tutorialActive){
    if(!paused)update(dt);
    draw();
    updateTutorial(dt);
    drawTutorialOverlay();
    if(paused)drawPause();
  }else{
    if(!paused)update(dt);
    draw();
    if(coffeeBreak){coffeeBreak.t+=dt;drawCoffeeBreak();}
    else if(bulletTime)drawBulletTime();
    if(attractDemo){
      attractDemoT+=dt;
      drawAttractOverlay();
      if(attractDemoT>40||gameOverState||gameWon){gameOverState=false;gameWon=false;startAttractDemo();}
    }else if(paused){drawPause();_ovlPadNav();}
    else if(gameOverState){_goT+=dt;drawGameOver();if(_goT>1.5)_ovlPadNav();}
    else if(gameWon){endingT+=dt;drawWin();_ovlPadNav();}
  }
  requestAnimationFrame(loop);
})(last);


})();
